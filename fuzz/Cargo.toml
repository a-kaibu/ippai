# Coverage-guided fuzzing (cargo-fuzz / libFuzzer, nightly): fuzz/README.md.
[package]
name = "masu-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
koji = { path = "../crates/koji" }
sake = { path = "../crates/sake" }
kura = { path = "../crates/kura" }
vorbis = { path = "../crates/vorbis" }
glwgsl = { path = "../crates/glwgsl" }
dxwgsl = { path = "../crates/dxwgsl" }
hlslc = { path = "../crates/hlslc" }
apitrace = { path = "../crates/apitrace" }
msidb = { path = "../crates/msidb" }
mpeg1 = { path = "../crates/mpeg1" }
asf = { path = "../crates/asf" }
wmcodec = { path = "../crates/wmcodec" }
naga = { version = "30", features = ["wgsl-in"] }
wasmparser = "0.263.0"
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "threads"] }

[lib]
path = "src/lib.rs"

[workspace]

[patch.crates-io]
naga = { path = "../vendor/naga" }

[profile.release]
debug = 1

[[bin]]
name = "x86_interp"
path = "fuzz_targets/x86_interp.rs"
test = false
doc = false
bench = false

