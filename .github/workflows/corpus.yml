# Trial-game corpus on sake: tests/corpus/titles.tsv (vnbox's trials, downloaded on the runner
# from the VN Mirror Archive when it has them, tests/corpus/mirror.py, else from their original
# sites; no game file is ever stored on GitHub) run in headless Chromium
# against the build CI made, sharded over parallel jobs. Each title must reach its `expect`
# level (title screen / story) and its `look` level (sake's title / steps screens match Windows'
# answers, tests/corpus/golden from corpusref.yml); tests/corpus/check.py grades, lists the DLLs
# each title asked for that sake does not have, and fails the run on a regression.
#   - after CI succeeds on main: the smoke rows (smoke=1)
#   - nightly and by hand (workflow_dispatch): every title, 10 jobs at most at once
# sake's C:\ is only fonts (tools/ci/sake-fonts.py, IPA fonts renamed), no Wine DLLs.
name: Corpus

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      set:
        description: "smoke or full"
        default: full
        type: choice
        options: [smoke, full]
      only:
        description: "only these title ids (space-separated; overrides set)"
        default: ""
      screen:
        description: "sake's screen (tests/corpus/ci.sh SCREEN; Windows' answers are 1920x1080; none: sake's own)"
        default: "1920x1080"
      ci_run:
        description: "the CI run whose build is tested (a bisect; default the newest successful one of main)"
        default: ""
      env:
        description: "more of sake's environment, NAME=value separated by spaces (e.g. IPPAI_JIT=0: the interpreter alone)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  # (one at a time per kind, the newest waiting; a running one isn't cancelled, or with CI
  # finishing every few minutes no smoke run would ever finish)
  group: corpus-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      sha: ${{ steps.p.outputs.sha }}
      set: ${{ steps.p.outputs.set }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mirror-trials
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SET: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
          CI_RUN: ${{ inputs.ci_run }}
        run: |
          if [ -n "$CI_RUN" ]; then
            RUN_ID=$CI_RUN SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq .head_sha)
          elif [ "$EVENT" != workflow_run ]; then
            # the newest successful CI build of main
            read -r RUN_ID SHA < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
              --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ "$EVENT" = workflow_run ]; then SET=smoke; fi
          SET=${SET:-full}
          # 10 jobs for every title (half of GitHub's 20 parallel jobs: other CI keeps running),
          # 4 for the smoke rows
          if [ -n "$ONLY" ]; then N=$(echo $ONLY | wc -w); N=$(( N < 10 ? N : 10 ))
          elif [ "$SET" = full ]; then N=10; else N=4; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "set=$SET" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
          echo "build: CI run $RUN_ID ($SHA), set $SET, $N shards"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # (GitHub's maximum: slow trial hosts are fine)
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # (the harness and titles.tsv as they are now; the build is the CI run's)
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ippai
          path: dist
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      # (tests/corpus-prep.sh: the VN Mirror Archive's copy of a title when it has one)
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: mirror-trials
          path: mirror
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-corpus-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-corpus-
      - run: tools/ci/pnpm.sh
      # (Playwright's Chromium, per Playwright version; the runner image has its libraries, as Bench found: no apt)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-2
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools-zstd-fonts-ipafont-gothic-fonts-ipafont-mincho
      - id: cache-3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-fonttools==4.59.0
      - name: Tools
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # (room for two lanes of trials: the runner's preinstalled SDKs take ~30 GB)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          tools/ci/apt.sh unar unrar innoextract convmv p7zip-full msitools zstd fonts-ipafont-gothic fonts-ipafont-mincho
          tools/ci/pip.sh fonttools==4.59.0
          mkdir -p "$RUNNER_TEMP/pw" && pnpm add --dir "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          mkdir -p "$RUNNER_TEMP/dist"
          # (tools/ci/build.sh names it by git describe, ippai-v0.1.1-35-g900cc23 or a bare
          # short sha before any tag, and empties target/dist first: the artifact holds one build;
          # its VERSION file carries the full commit, checked against the run's)
          TARS=(dist/ippai-*.tar.zst)
          [ ${#TARS[@]} = 1 ] && [ -f "${TARS[0]}" ] || { echo "want one build in the artifact: ${TARS[*]}"; ls -la dist; exit 1; }
          tar -I zstd -xf "${TARS[0]}" -C "$RUNNER_TEMP/dist" --strip-components=1
          read -r V BUILT < "$RUNNER_TEMP/dist/VERSION"
          [ "$BUILT" = "$SHA" ] || { echo "artifact is $V ($BUILT), CI run was $SHA"; exit 1; }
          echo "build $V ($BUILT)"
          python3 tools/ci/sake-fonts.py "$RUNNER_TEMP/fonts"
          wait
      - name: Extraction of zips unar fails on (tests/test_unzip_cp932.py)
        run: python3 tests/test_unzip_cp932.py
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - if: steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools-zstd-fonts-ipafont-gothic-fonts-ipafont-mincho
      - if: steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-fonttools==4.59.0
      - name: Corpus shard ${{ matrix.shard }}
        env:
          SET: ${{ needs.plan.outputs.set }}
          ONLY: ${{ inputs.only }}
          SCREEN: ${{ inputs.screen || '1920x1080' }}
          SAKE_ENV: ${{ inputs.env }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          export PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright/index.js"
          [ -f mirror/mirror-trials.json ] && export MIRROR=$PWD/mirror/mirror-trials.json
          tests/corpus/ci.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/fonts" results
      # results.json (look.json: sake's screens against Windows', tests/corpus/golden), logs, and
      # the two shots compared with Windows' (title, steps: trial games, as the golden answers)
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: corpus-${{ matrix.shard }}
          path: |
            results/**/*.json
            results/**/*.log
            results/**/*.txt
            results/**/title.png
            results/**/steps.png
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: corpus-*
          path: results
      - name: Grade
        env:
          RUN: ${{ needs.run.result }}
        run: |
          python3 tests/corpus/check.py tests/corpus/titles.tsv results --min-prepared-ratio 0.8 --summary "$GITHUB_STEP_SUMMARY" --summary report.md
          # (a shard that broke before grading its titles fails the run too)
          [ "$RUN" = success ] || { echo "a corpus job failed: $RUN"; exit 1; }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: corpus-report
          path: report.md
          retention-days: 30

  # Use-case coverage (tests/coverage/usage.py): the entry points the games of a full run called
  # (IPPAI_API_COUNTS tallies in their console logs) beside the ones kura's and sake's unit tests
  # call; the report goes to tests/coverage/usage.md on main (text only)
  usage:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.set == 'full' && inputs.only == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: corpus-*
          path: results
      - name: Tallies of the unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          IPPAI_API_COUNTS=1 IPPAI_API_COUNTS_OUT="$RUNNER_TEMP/tests/kura.txt" cargo test -q --release -p kura --lib -- --skip f16_bits
          IPPAI_API_COUNTS=1 IPPAI_API_COUNTS_OUT="$RUNNER_TEMP/tests/sake.txt" cargo test -q --release -p sake --lib
      # (the unit tests call sake's functions directly, never through a guest's import: the
      # api: keys come from programs on sake, host/tests in CI and Wine's tests in Conformance,
      # their newest tallies on main)
      - name: Tallies of host/tests and Wine's tests on sake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in ci.yml:api-counts-host-tests conformance.yml:winetest-; do
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w "${w%%:*}" -b main -s completed -L 1 --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] || { echo "no finished ${w%%:*} run on main"; continue; }
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p "${w#*:}*" -D "$RUNNER_TEMP/tests/${w%%.*}" || echo "no tallies in run $id"
          done
          find "$RUNNER_TEMP/tests" -name 'api-counts*' -o -name 'host-tests.txt' | sed 's/^/tallies: /'
      - name: Report
        run: |
          python3 tests/coverage/usage.py --games results --tests "$RUNNER_TEMP/tests" --md tests/coverage/usage.md > /dev/null
          cat tests/coverage/usage.md >> "$GITHUB_STEP_SUMMARY"
          git add tests/coverage/usage.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "coverage: use-case report of corpus run ${{ github.run_id }} (${{ needs.plan.outputs.sha }})"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
