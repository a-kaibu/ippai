# Trial-game corpus on sake: tests/corpus/titles.tsv (vnbox's trials, downloaded from their
# original sites on the runner; no game file is ever stored on GitHub) run in headless Chromium
# against the build CI made, sharded over parallel jobs. Each title must reach its `expect`
# level (title screen / story); tests/corpus/check.py grades, lists the DLLs each title asked
# for that sake does not have, and fails the run on a regression.
#   - after CI succeeds on main: the smoke rows (smoke=1)
#   - nightly and by hand (workflow_dispatch): every title, 10 jobs at most at once
# sake's C:\ is only fonts (tools/ci/sake-fonts.py, IPA fonts renamed), no Wine DLLs.
name: Corpus

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      set:
        description: "smoke or full"
        default: full
        type: choice
        options: [smoke, full]
      only:
        description: "only these title ids (space-separated; overrides set)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: corpus-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      sha: ${{ steps.p.outputs.sha }}
      set: ${{ steps.p.outputs.set }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SET: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$EVENT" != workflow_run ]; then
            # the newest successful CI build of main
            read -r RUN_ID SHA < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
              --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ "$EVENT" = workflow_run ]; then SET=smoke; fi
          SET=${SET:-full}
          # 10 jobs for every title (half of GitHub's 20 parallel jobs: other CI keeps running),
          # 4 for the smoke rows
          if [ -n "$ONLY" ]; then N=$(echo $ONLY | wc -w); N=$(( N < 10 ? N : 10 ))
          elif [ "$SET" = full ]; then N=10; else N=4; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "set=$SET" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
          echo "build: CI run $RUN_ID ($SHA), set $SET, $N shards"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # (GitHub's maximum: slow trial hosts are fine)
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # (the harness and titles.tsv as they are now; the build is the CI run's)
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ippai
          path: dist
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Tools
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # (room for two lanes of trials: the runner's preinstalled SDKs take ~30 GB)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends unar unrar innoextract convmv p7zip-full msitools zstd \
            fonts-ipafont-gothic fonts-ipafont-mincho
          pip install --user -q fonttools==4.59.0
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/dist"
          # (tools/ci/build.sh names it by git describe, ippai-v0.1.1-35-g900cc23 or a bare
          # short sha before any tag, and empties target/dist first: the artifact holds one build;
          # its VERSION file carries the full commit, checked against the run's)
          TARS=(dist/ippai-*.tar.zst)
          [ ${#TARS[@]} = 1 ] && [ -f "${TARS[0]}" ] || { echo "want one build in the artifact: ${TARS[*]}"; ls -la dist; exit 1; }
          tar -I zstd -xf "${TARS[0]}" -C "$RUNNER_TEMP/dist" --strip-components=1
          read -r V BUILT < "$RUNNER_TEMP/dist/VERSION"
          [ "$BUILT" = "$SHA" ] || { echo "artifact is $V ($BUILT), CI run was $SHA"; exit 1; }
          echo "build $V ($BUILT)"
          python3 tools/ci/sake-fonts.py "$RUNNER_TEMP/fonts"
          wait
      - name: Corpus shard ${{ matrix.shard }}
        env:
          SET: ${{ needs.plan.outputs.set }}
          ONLY: ${{ inputs.only }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          export PLAYWRIGHT=$(npm root -g)/playwright/index.js
          tests/corpus/ci.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/fonts" results
      # results.json, console and server logs only: no screenshots of the games on GitHub
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: corpus-${{ matrix.shard }}
          path: |
            results/**/*.json
            results/**/*.log
            results/**/*.txt
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: corpus-*
          path: results
      - name: Grade
        env:
          RUN: ${{ needs.run.result }}
        run: |
          python3 tests/corpus/check.py tests/corpus/titles.tsv results --summary "$GITHUB_STEP_SUMMARY" --summary report.md
          # (a shard that broke before grading its titles fails the run too)
          [ "$RUN" = success ] || { echo "a corpus job failed: $RUN"; exit 1; }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: corpus-report
          path: report.md
          retention-days: 30
