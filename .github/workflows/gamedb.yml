name: Game database

on:
  workflow_dispatch:
    inputs:
      part:
        description: Database to rebuild from the public SQLite mirrors
        type: choice
        options: [all, egs, vndb]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: gamedb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-
      - run: cargo build --release -p ippai
      # Manual only. Each part is checked before publication; retain EGS enrichment.
      - name: Build and push
        env:
          GHCR_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
        run: |
          parts="$PART"
          if [ "$parts" = all ]; then parts="egs vndb"; fi
          failed=0
          for part in $parts; do
            ./target/release/ippai gamedb update --part "$part" "$RUNNER_TEMP/gamedb" || failed=1
          done
          exit "$failed"
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
