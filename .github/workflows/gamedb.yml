# The game database (crates/ippai/src/gamedb.rs): every ErogameScape game (with its brand, tags and
# series) and every Japanese VN on VNDB in one SQLite file, built each day and pushed to GitHub
# Packages (ghcr.io/a-kaibu/ippai-gamedb:latest, `ippai gamedb update`). ippai serve pulls it once a
# day, so it identifies games and shows their information without reaching ErogameScape, which
# refuses many hosts (the user, 2026-11-09: "批評空間とvndbのdbをsqliteとかにしてgh packagesにup").
#
# ErogameScape refuses GitHub's runners by their address and answers worker2's, so the job joins
# the tailnet and goes out through worker2 as its exit node (the user: "worker2のipでgha動かしたら
# いい", "セルフホストじゃなくて"): secrets TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET, setup in
# tools/gamedb/README.md.
name: Game database

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamedb.yml'
      - 'crates/ippai/src/gamedb.rs'
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gamedb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # (without the tailnet's secrets: VNDB's part only, ErogameScape's kept from before)
      TAILNET: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-
      - run: cargo build --release -p ippai
      - name: Out through worker2 (ErogameScape answers its address)
        if: env.TAILNET == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --exit-node=${{ vars.GAMEDB_EXIT_NODE || 'kota-server-worker-2' }}
          ping: ${{ vars.GAMEDB_EXIT_NODE || 'kota-server-worker-2' }}
      # (pull the copy published now, build (ErogameScape at its pace, VNDB within its rate
      # limit), check (both parts there when out through worker2), push)
      - name: Build and push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: ./target/release/ippai gamedb update ${{ env.TAILNET == 'true' && '--egs' || '' }} "$RUNNER_TEMP/gamedb"
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
