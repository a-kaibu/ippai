# The game database (crates/ippai/src/gamedb.rs): every ErogameScape game (with its brand, tags and
# series) and every Japanese VN on VNDB in one SQLite file, built each day and pushed to GitHub
# Packages (ghcr.io/a-kaibu/ippai-gamedb:latest, `ippai gamedb update`). ippai serve pulls it once
# a day, so it identifies games and shows their information without reaching ErogameScape, which
# refuses many hosts (the user, 2026-11-09: "批評空間とvndbのdbをsqliteとかにしてgh packagesにup").
#
# On worker2, a self-hosted runner (labels self-hosted, worker2): ErogameScape refuses GitHub's
# runners by their address and answers worker2's (the user: "worker2のipでgha動かしたらいい").
# ippai from the latest release, so worker2 needs no toolchain. Setup: tools/gamedb/README.md.
name: Game database

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamedb.yml'
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gamedb
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, worker2]
    timeout-minutes: 120
    steps:
      - name: ippai from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) echo "$(uname -m)?"; exit 1 ;; esac
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | python3 -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('_linux_$arch.tar.gz')))")
          echo "$url"
          rm -rf "$RUNNER_TEMP/ippai" && mkdir -p "$RUNNER_TEMP/ippai"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/ippai"
          "$RUNNER_TEMP/ippai/ippai" gamedb --help | grep -q update
      # (pull the copy published now, build (ErogameScape at its pace, VNDB within its rate
      # limit), check that both parts are there, push)
      - name: Build and push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/ippai/ippai" gamedb update --egs "$RUNNER_TEMP/gamedb"'
