# The game database's VNDB part (crates/ippai/src/gamedb.rs): every Japanese VN on VNDB in one
# SQLite file, pushed to GitHub Packages as ghcr.io/a-kaibu/ippai-gamedb:vndb
# (`ippai gamedb update --part vndb`). ippai serve pulls it once a day with ErogameScape's part
# (:egs, built by hand on a host ErogameScape answers: it refuses GitHub's runners;
# tools/gamedb/update.sh). By hand only (the user, 2026-11-09: "一旦手動更新でいいや"):
# Actions -> Game database -> Run workflow.
name: Game database

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gamedb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gamedb-${{ runner.os }}-${{ env.RUST_KEY }}-
      - run: cargo build --release -p ippai
      # (pull the copy published now, build (ErogameScape at its pace, VNDB within its rate
      # limit), check, push)
      - name: Build and push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: ./target/release/ippai gamedb update --part vndb "$RUNNER_TEMP/gamedb"
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
