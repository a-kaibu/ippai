# Differential test against real Windows (tests/winref). Windows' answers are kept in the
# repository (tests/winref/golden, golden.py): every push checks sake's node build against them
# (JIT and interpreter; tests/winref/known.txt lists the differences already understood), with
# no Windows involved, as tests/winref/check.sh does locally (GPU probes in headless Chromium). The Windows runner only runs when a
# probe changed or has no answer yet (or by hand): it records the new answers and commits them.
#
# Main pushes test the newest cumulative revision, not obsolete queued builds. `golden.py stale`
# still asks Windows for every missing or out-of-date answer. Nightly/manual runs keep their own
# group; Windows recording does not wait for sake's comparison.
name: winref

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'crates/**'
      - 'host/tests/**'
      - 'tests/winref/**'
      - 'wingfx/**'
      - 'tests/replay/**'
      - 'testdata/apitrace/**'
      - 'Cargo.lock'
      - '.github/workflows/winref.yml'
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: 'Record every probe on Windows again'
        type: boolean
        default: false

permissions:
  contents: read
  # (the trial games' traces on ghcr.io: tests/replay/games.py)
  packages: read

concurrency:
  group: winref-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.stale.outputs.list }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-clang-lld-llvm
      - name: mingw-w64
        run: tools/ci/apt.sh mingw-w64 clang lld llvm
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-clang-lld-llvm
      # (the trial games' traces pulled from ghcr.io, kept: tests/replay/games.py)
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/masu-traces
          key: traces-${{ hashFiles('testdata/apitrace/*.txt') }}
          restore-keys: traces-
      - name: Build the probes
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: tests/winref/build.sh "$RUNNER_TEMP/exe" && tests/winref/build-msvc.sh "$RUNNER_TEMP/exe"
      # (sake-only GPU checks, not probes: in subdirectories, which run.sh and golden.py skip)
      - name: Build the identity-blend and D3D9 submission checks
        run: |
          python3 tests/winref/identity-blend.py build "$RUNNER_TEMP/exe/extra/identity-blend"
          python3 tests/bench/d3d9_submit.py build "$RUNNER_TEMP/exe/extra/d3d9-submit"
      # (the replay's layouts are the headers' (clang) and gcc's; check.py's matching; asset.sh; golden.py's import)
      - name: The replay's own checks
        run: python3 tests/replay/layouts.py --check && python3 tests/replay/layouts_test.py && python3 tests/replay/check_test.py && python3 tests/replay/gameapi_test.py && python3 tests/replay/games_test.py && sh tests/replay/asset_test.sh && python3 tests/winref/golden_test.py && python3 tests/winref/run_test.py
      - run: node --test tests/winref/partition.test.mjs
      - run: python3 tests/winref/compare_test.py
      - name: Probes without a current Windows answer
        id: stale
        run: |
          l=$(python3 tests/winref/golden.py stale "$RUNNER_TEMP/exe" | tr '\n' ' ')
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.all }}" = true ]; then l=all; fi
          echo "list=$l" >> "$GITHUB_OUTPUT"
          echo "stale: $l"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winref-exe
          path: ${{ runner.temp }}/exe
          retention-days: 7

  # A probe's trace replayed on Windows reads back the probe's own pictures (tests/replay/check.py).
  # A job of its own, needed by none: a replay that misses a picture fails here alone, and sake's
  # comparison and Windows' recording (which a fix to the replay waits for) go on.
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Replays of the probes' traces against the probes
        run: python3 tests/replay/check.py

  sake-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-sake-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-sake-
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-key.sh
      # (rust-src and the emscripten std, per stable rustc)
      - id: cache-3
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - run: tools/ci/rust-wasm.sh
      - if: steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      # (Emscripten, one cache shared with CI, Conformance, Release and Bench)
      - id: cache-emsdk
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/emsdk4
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/ci/emsdk.sh') }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: winref-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            winref-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            winref-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Build sake (node)
        run: |
          . tools/ci/emsdk.sh
          OUT=$PWD/target/sake-out bash crates/sake/build.sh
      - if: github.ref == 'refs/heads/main' && steps.cache-emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/emsdk4
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/ci/emsdk.sh') }}
      - name: sake's fonts (IPA fonts renamed, for the probes that measure text)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends fonts-ipafont-gothic fonts-ipafont-mincho
          pip install fonttools
          python3 tools/ci/sake-fonts.py target/winref-fonts
      - name: The web app and masu
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)
          cargo build --release -p masu
      # tar preserves the binary's executable bit across artifact downloads.
      - name: Package the exact runtime for every probe runner
        run: tar -czf "$RUNNER_TEMP/winref-runtime.tar.gz" target/sake-out/*.js target/sake-out/*.wasm target/release/masu web/dist target/winref-fonts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winref-runtime
          path: ${{ runner.temp }}/winref-runtime.tar.gz
          retention-days: 3
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The old combined job took ~50 minutes just for GPU probes. A browser per runner,
  # four disjoint shards; node's JIT/interpreter passes get independent prefixes/runners.
  sake-node:
    needs: [probes, sake-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [jit, interp]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-runtime
          path: runtime
      - run: tar -xzf runtime/winref-runtime.tar.gz
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: Run the node probes
        env:
          MODE: ${{ matrix.mode }}
          MASU_JIT: ${{ matrix.mode == 'interp' && '0' || '1' }}
        run: FONTS=$PWD/target/winref-fonts SAKE=$PWD/target/sake-out/sake.js tests/winref/run.sh exe "out/$MODE"
      - name: Compare with Windows immediately (without waiting for the GPU)
        env:
          MODE: ${{ matrix.mode }}
        run: python3 tests/winref/compare.py tests/winref/golden "out/$MODE" --known tests/winref/known.txt --quarantine tests/winref/quarantine.tsv
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winref-out-node-${{ matrix.mode }}
          path: out
          retention-days: 7

  sake-browser:
    needs: [probes, sake-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-sake-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-sake-
      - run: tools/ci/pnpm.sh
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && pnpm add --dir "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-runtime
          path: runtime
      - run: tar -xzf runtime/winref-runtime.tar.gz
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: GPU probes (one browser at a time, both engines)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          WEB: web/dist
          TIMEOUT: 900
          SHARD: ${{ matrix.shard }}/4
        run: |
          export FONTS=$PWD/target/winref-fonts
          node tests/winref/run-browser.mjs exe out/jit
          NO_GAMES=1 MASU_JIT=0 node tests/winref/run-browser.mjs exe out/interp
          BROWSER64=1 node tests/winref/run-browser.mjs exe out/jit d2d-64
          BROWSER64=1 MASU_JIT=0 node tests/winref/run-browser.mjs exe out/interp d2d-64
      # (metamorphic: disabled blending and ONE/ZERO ADD render the same; the submission
      # benchmark's rounds give the same pixels. Both memories' runtimes.)
      - name: Identity blending and D3D9 submission (sake only)
        if: ${{ matrix.shard == 0 }}
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          WEB: web/dist
        run: |
          export FONTS=$PWD/target/winref-fonts
          python3 tests/winref/identity-blend.py check exe/extra/identity-blend out/extra/identity-blend
          MEMORY=grow python3 tests/winref/identity-blend.py check exe/extra/identity-blend out/extra/identity-blend-grow
          python3 tests/bench/d3d9_submit.py check exe/extra/d3d9-submit out/extra/d3d9-submit
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winref-out-browser-${{ matrix.shard }}
          path: out
          retention-days: 7

  sake:
    needs: [sake-node, sake-browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: winref-out-*
          merge-multiple: true
          path: out
      - name: sake (JIT) against Windows
        run: python3 tests/winref/compare.py tests/winref/golden out/jit --known tests/winref/known.txt --quarantine tests/winref/quarantine.tsv --png png --report jit.md
      - name: sake (interpreter) against Windows
        if: always()
        run: python3 tests/winref/compare.py tests/winref/golden out/interp --known tests/winref/known.txt --quarantine tests/winref/quarantine.tsv --report interp.md
      - name: Summary
        if: always()
        run: cat jit.md interp.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winref-sake
          path: |
            out
            jit.md
            interp.md
            png
          retention-days: 30

  windows:
    needs: probes
    if: needs.probes.outputs.stale != ''
    runs-on: windows-2025
    # (the probes take ~7 min and the trial-game replays ~13 min more: 20 cut every run off
    # before the answers were uploaded)
    timeout-minutes: 45
    concurrency:
      group: winref-windows-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: Run on Windows
        shell: bash
        run: tests/winref/run.sh exe ref
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winref-windows
          path: ref
          retention-days: 30

  # Windows' answers into tests/winref/golden (a commit on main; text and small PNGs). They are
  # imported at this run's commit (src = the sources the probes were built from), then copied onto
  # How far each trial game's replay goes (tests/replay/status.py: Captured, Convertible,
  # Faithful on Windows, Compatible on sake), into tests/replay/status.tsv, and drill.txt narrowed
  # toward the first draw sake does differently (its probes are built, answered and compared by
  # the next run). A commit on main: drill.txt changing starts that run; status.tsv alone does not.
  status:
    needs: [probes, sake]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: winref-status-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-sake
          path: sake
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: The replays' status
        run: |
          python3 tests/replay/status_test.py
          python3 tests/replay/status.py --sake sake/out/jit --convert exe/convert --report status.md --tsv tests/replay/status.tsv --drill
          cat status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit it
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            cp tests/replay/status.tsv tests/replay/drill.txt "$M/tests/replay/"
            git -C "$M" add tests/replay/status.tsv tests/replay/drill.txt
            if git -C "$M" diff --cached --quiet; then echo "no change"; exit 0; fi
            skip=; git -C "$M" diff --cached --quiet -- tests/replay/drill.txt && skip=" [skip ci]"
            git -C "$M" commit -qm "replay: the trial games' replays as far as they go (${GITHUB_SHA::7})$skip"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  # the newest main for each probe whose sources there are still the same (one changed since is
  # left stale for a later run); main moved on before the push -> again from a fresh main.
  golden:
    needs: [probes, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: winref-golden-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-windows
          path: ref
      - name: Commit the answers
        run: |
          l="${{ needs.probes.outputs.stale }}"
          [ "$l" = all ] && l=
          python3 tests/winref/golden.py import ref $l > "$RUNNER_TEMP/imported"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            took=
            while read -r p; do
              if [ "$(cat "tests/winref/golden/$p/src")" = "$(python3 "$M/tests/winref/golden.py" src "$p")" ]; then
                rm -rf "$M/tests/winref/golden/$p" && cp -r "tests/winref/golden/$p" "$M/tests/winref/golden/$p"
                took="$took $p"
              else
                echo "$p: its sources changed on main since ${GITHUB_SHA::7}, left for a later run"
              fi
            done < "$RUNNER_TEMP/imported"
            git -C "$M" add tests/winref/golden
            if git -C "$M" diff --cached --quiet; then echo "no change"; exit 0; fi
            git -C "$M" commit -qm "winref: Windows' answers for${took} (${GITHUB_SHA::7})"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
