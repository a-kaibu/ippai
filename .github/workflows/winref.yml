# Differential test against real Windows (tests/winref). Windows' answers are kept in the
# repository (tests/winref/golden, golden.py): every push checks sake's node build against them
# (JIT and interpreter; tests/winref/known.txt lists the differences already understood), with
# no Windows involved, as tests/winref/check.sh does locally (GPU probes in headless Chromium). The Windows runner only runs when a
# probe changed or has no answer yet (or by hand): it records the new answers and commits them.
#
# Many threads push to main minutes apart, so the runs don't queue one per commit: the jobs that
# hold a runner (sake, windows, golden) each have their own concurrency group with at most one
# running and the newest commit's waiting (a waiting job of an older commit is dropped: the newer
# commit has its probes too, and `golden.py stale` asks Windows for every probe whose answer is
# missing or out of date, whichever commit changed it). Recording Windows' answers doesn't wait
# for the slower sake comparison. Nightly and on release tags too.
name: winref

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'crates/**'
      - 'host/tests/**'
      - 'tests/winref/**'
      - 'Cargo.lock'
      - '.github/workflows/winref.yml'
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: 'Record every probe on Windows again'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.stale.outputs.list }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends mingw-w64 clang lld llvm
      - name: Build the probes
        run: tests/winref/build.sh "$RUNNER_TEMP/exe" && tests/winref/build-msvc.sh "$RUNNER_TEMP/exe"
      - name: Probes without a current Windows answer
        id: stale
        run: |
          l=$(python3 tests/winref/golden.py stale "$RUNNER_TEMP/exe" | tr '\n' ' ')
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.all }}" = true ]; then l=all; fi
          echo "list=$l" >> "$GITHUB_OUTPUT"
          echo "stale: $l"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winref-exe
          path: ${{ runner.temp }}/exe
          retention-days: 7

  sake:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: winref-sake-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tools
        run: |
          rustup component add rust-src
          rustup target add wasm32-unknown-emscripten
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: tools/ci/rust-key.sh
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: winref-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/emsdk.sh') }}-${{ github.run_id }}
          restore-keys: |
            winref-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/emsdk.sh') }}-
            winref-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Build sake (node)
        run: |
          . tools/ci/emsdk.sh
          OUT=$PWD/target/sake-out bash crates/sake/build.sh
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: Run on sake (JIT, interpreter)
        run: |
          SAKE=$PWD/target/sake-out/sake.js tests/winref/run.sh exe out/jit
          IPPAI_JIT=0 SAKE=$PWD/target/sake-out/sake.js tests/winref/run.sh exe out/interp
      # GPU probes (Direct3D ...): sake in headless Chromium, WebGPU (software)
      - name: Browser tools, the web app and ippai
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          (cd web && npm ci --no-audit --no-fund && npx vp build)
          cargo build --release -p ippai
      - name: Run the GPU probes on sake in the browser (JIT, interpreter)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          WEB: web/dist
        run: |
          node tests/winref/run-browser.mjs exe out/jit
          IPPAI_JIT=0 node tests/winref/run-browser.mjs exe out/interp
      - name: sake (JIT) against Windows
        run: python3 tests/winref/compare.py tests/winref/golden out/jit --known tests/winref/known.txt --png png --report jit.md
      - name: sake (interpreter) against Windows
        if: always()
        run: python3 tests/winref/compare.py tests/winref/golden out/interp --known tests/winref/known.txt --report interp.md
      - name: Summary
        if: always()
        run: cat jit.md interp.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winref-sake
          path: |
            out
            jit.md
            interp.md
            png
          retention-days: 30
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        run: python3 tools/ci/cache-prune.py target

  windows:
    needs: probes
    if: needs.probes.outputs.stale != ''
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: winref-windows-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-exe
          path: exe
      - name: Run on Windows
        shell: bash
        run: tests/winref/run.sh exe ref
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winref-windows
          path: ref
          retention-days: 30

  # Windows' answers into tests/winref/golden (a commit on main; text and small PNGs). They are
  # imported at this run's commit (src = the sources the probes were built from), then copied onto
  # the newest main for each probe whose sources there are still the same (one changed since is
  # left stale for a later run); main moved on before the push -> again from a fresh main.
  golden:
    needs: [probes, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: winref-golden-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winref-windows
          path: ref
      - name: Commit the answers
        run: |
          l="${{ needs.probes.outputs.stale }}"
          [ "$l" = all ] && l=
          python3 tests/winref/golden.py import ref $l > "$RUNNER_TEMP/imported"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            took=
            while read -r p; do
              if [ "$(cat "tests/winref/golden/$p/src")" = "$(python3 "$M/tests/winref/golden.py" src "$p")" ]; then
                rm -rf "$M/tests/winref/golden/$p" && cp -r "tests/winref/golden/$p" "$M/tests/winref/golden/$p"
                took="$took $p"
              else
                echo "$p: its sources changed on main since ${GITHUB_SHA::7}, left for a later run"
              fi
            done < "$RUNNER_TEMP/imported"
            git -C "$M" add tests/winref/golden
            if git -C "$M" diff --cached --quiet; then echo "no change"; exit 0; fi
            git -C "$M" commit -qm "winref: Windows' answers for${took} (${GITHUB_SHA::7})"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
