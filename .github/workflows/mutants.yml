# Mutation testing (cargo-mutants, tools/ci/mutants.sh): each push and pull request mutates the
# Rust lines it changed and runs those crates' tests; a mutant the tests do not notice is a gap.
# Missed mutants fail the run only in the files of tools/ci/mutants-gate.txt (all caught there
# today); elsewhere they are listed in the job summary. The gate files' full run is weekly and on
# release tags.
#
# On main one run at a time, the newest commit's waiting (many threads push minutes apart; a run
# per commit used to hold half of the 20 runners). No change goes unmutated: a push run mutates
# everything since the commit the last successful push run tested, not only its own commit.
name: Mutants

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      base:
        description: "mutate the changes since this commit (empty: the gate files)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: mutants-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_MUTANTS_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: mutants-${{ runner.os }}-
      - name: Mutants of the change
        if: (github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request' || inputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            # (the commit the last successful push run on this branch mutated up to)
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutants.yml --branch "${{ github.ref_name }}" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then BASE=$last; fi
            echo "mutants: changes since ${BASE::7}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          tools/ci/mutants.sh diff "$BASE"
      - name: Mutants of the gate files
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.base == '') || github.ref_type == 'tag'
        run: tools/ci/mutants.sh gate
      - name: Summary
        if: always()
        run: cat target/mutants.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mutants
          path: target/mutants.out
          if-no-files-found: ignore
          retention-days: 14
