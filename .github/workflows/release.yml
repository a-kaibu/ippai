# Release from the GitHub web UI: Actions → Release → Run workflow, pick patch / minor / major:
# svu takes the next version after the last v* tag and the workflow tags main with it. A v* tag
# pushed by hand (git tag v0.1.0 && git push origin v0.1.0) releases that tag the same way. Only a
# build and a release: no tests here (CI runs them on every push).
#
# Jobs: web (sake.wasm, the page and sake's fonts, once: the same for every target), version and
# bin (one runner per target) run at once: bin builds ippai without the page while web builds it,
# takes web's artifacts the moment they are uploaded (tools/ci/wait-artifacts.sh; web's cache
# saves come after) and builds again, which recompiles the ippai crate only (crates/ippai/build.rs);
# archived with README.md and fonts/ as ippai_<version>_<os>_<arch>.tar.gz (.zip for
# Windows: install.sh reads these names); then release: checksums.txt and `gh release create`
# (notes generated by GitHub).
#
# Caches: a run for a tag can only restore caches saved on main (GitHub scopes caches by ref),
# so nothing is saved by a release: the nightly run on main (schedule: everything but the
# release job; a dry_run dispatch is the same) saves them (web's emsdk, wasm registry builds and
# pnpm store, bin's per-target cargo caches, the apt and pip downloads; rust-src and the
# emscripten std are CI's build job's cache).
name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Build only: no tag, no release (measures a release; warms the caches)"
        required: false
        default: false
        type: boolean

  # (builds only, on main: keeps the caches a release restores warm)
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: write
  # (bin reads web's artifacts while the run goes on: tools/ci/wait-artifacts.sh)
  actions: read

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.dry_run) && 'warm' || 'release' }}
  cancel-in-progress: false

jobs:
  version:
    # manual releases only from main
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup svu
        if: github.event_name == 'workflow_dispatch'
        uses: freerangebytes/setup-svu@v0.2.1
      - id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case $EVENT in
            workflow_dispatch) tag=$(svu "$BUMP_TYPE") ;;
            push) tag=$REF_NAME ;;
            *) tag=v0.0.0 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version: $tag"

  web:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      # (sake's C:\ is fonts only: the IPA fonts under the Windows names, in the archives as fonts/)
      - id: cache-apt
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-fonts-ipafont-gothic-fonts-ipafont-mincho-python3-fonttools
      - name: sake's fonts
        id: fonts
        background: true
        run: |
          tools/ci/apt.sh fonts-ipafont-gothic fonts-ipafont-mincho python3-fonttools
          python3 tools/ci/sake-fonts.py fonts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - id: cache-pnpm
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-release-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-release-
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-key.sh
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - run: tools/ci/rust-wasm.sh
      # (emsdk and the registry crates' wasm builds; saved on main only)
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-web-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/emsdk.sh') }}
          restore-keys: release-web-${{ env.RUST_KEY }}-
      # (the page's two sake builds only: SAKE_NODE=0 skips node's)
      - name: sake.wasm and the page
        run: |
          . tools/ci/emsdk.sh
          SAKE_NODE=0 OUT=$PWD/target/sake-out WEB_OUT=$PWD/web/public/sake bash crates/sake/build.sh
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: web/dist
          retention-days: 3
      - wait: fonts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fonts
          path: fonts
          retention-days: 3
      - if: github.ref == 'refs/heads/main' && steps.cache-pnpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: ${{ steps.cache-pnpm.outputs.cache-primary-key }}
      - name: Shrink the cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/cache-prune.py target
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - if: github.ref == 'refs/heads/main' && steps.cache-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-fonts-ipafont-gothic-fonts-ipafont-mincho-python3-fonttools

  bin:
    # (not web: its artifacts are waited for in the job)
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: linux, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, os: linux, arch: arm64 }
          # (pack, add and storage on the PC that has the games; serve runs in the foreground only)
          - { target: x86_64-pc-windows-gnu, os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      # (cargo-zigbuild and zig as wheels: tools/ci/pip.sh)
      - id: cache-pip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-cargo-zigbuild==0.24.1-ziglang==0.14.1
      - run: tools/ci/pip.sh cargo-zigbuild==0.24.1 ziglang==0.14.1
      - if: github.ref == 'refs/heads/main' && steps.cache-pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-cargo-zigbuild==0.24.1-ziglang==0.14.1
      - run: rustup target add ${{ matrix.target }}
      # (the registry crates' builds for this target and zig's libc builds; saved on main only)
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            ~/.cache/cargo-zigbuild
            target
          key: release-${{ matrix.target }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-${{ env.RUST_KEY }}-
      # (everything but the page, while web builds it: rust-embed's allow_missing)
      - name: cargo zigbuild without the page
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: IPPAI_VERSION=${TAG#v} cargo zigbuild --release --locked -p ippai --target "$TARGET"
      - name: web's page and fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/wait-artifacts.sh web web=web/dist fonts=target/stage/fonts
      - name: cargo zigbuild and the archive
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          IPPAI_VERSION=${TAG#v} cargo zigbuild --release --locked -p ippai --target "$TARGET"
          exe=ippai; [ "$OS" = windows ] && exe=ippai.exe
          # (the page is built in: this build's sake.wasm id is in the binary)
          grep -qF "$(head -1 web/dist/sake/build-id.txt)" "target/$TARGET/release/$exe" || { echo "the page is not built in" >&2; exit 1; }
          cp "target/$TARGET/release/$exe" README.md target/stage/
          name=ippai_${TAG#v}_${OS}_${ARCH}
          mkdir -p out
          if [ "$OS" = windows ]; then
            (cd target/stage && zip -qr "../../out/$name.zip" .)
          else
            chmod 755 "target/stage/$exe"
            tar -C target/stage -czf "out/$name.tar.gz" .
          fi
          ls -l out
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: out
          retention-days: 3
      - name: Shrink the cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/cache-prune.py target
      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            ~/.cache/cargo-zigbuild
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    needs: [version, bin]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # (a dispatch's tag is made here, on the commit the run built)
      - name: GitHub Release
        env:
          # RELEASE_TOKEN, when set, is used instead of GITHUB_TOKEN (v0.3.3's run 42569773538 got
          # HTTP 403 "Resource not accessible by integration" making the release and its tag;
          # cause not confirmed). A tag pushed by hand releases as well.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ippai_* > checksums.txt
          cat checksums.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes ippai_* checksums.txt
