# Release from the GitHub web UI: Actions → Release → Run workflow, pick patch / minor / major:
# svu takes the next version after the last v* tag and the workflow tags main with it. A v* tag
# pushed by hand (git tag v0.1.0 && git push origin v0.1.0) releases that tag the same way. Only a
# release: no tests here (CI runs them on every push). It builds sake.wasm and the page, makes
# sake's fonts, then GoReleaser builds ippai for Linux x86-64 and ARM64 with the page built in,
# smoke-tests it and puts the archives (with fonts/), checksums.txt and SBOMs on GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # manual releases only from main
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # (what tools/ci/build.sh needs, as CI's build job; and the IPA fonts for sake's C:\)
      - name: apt
        run: tools/ci/apt.sh mingw-w64 zstd clang lld llvm fonts-ipafont-gothic fonts-ipafont-mincho python3-fonttools
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-wasm.sh

      # sake.wasm and the page (the same for every target): built into the binaries
      - name: sake.wasm and the page
        run: |
          . tools/ci/emsdk.sh
          OUT=$PWD/target/sake-out WEB_OUT=$PWD/web/public/sake bash crates/sake/build.sh
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)

      # (sake's C:\ is fonts only: the IPA fonts under the Windows names, in the archives as fonts/)
      - name: sake's fonts
        run: python3 tools/ci/sake-fonts.py fonts

      - name: Setup svu
        if: github.event_name == 'workflow_dispatch'
        uses: freerangebytes/setup-svu@v0.2.1

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          version="$(svu "$BUMP_TYPE")"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$version"
          git push origin "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Created release tag: $version"

      - name: Rust targets
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-zigbuild

      - uses: anchore/sbom-action/download-syft@v0.24.3

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/ippai/target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && steps.tag.outputs.version
                || github.ref_name }}
