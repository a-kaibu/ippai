# Release from the GitHub web UI: Actions → Release → Run workflow, pick patch / minor / major:
# svu takes the next version after the last v* tag and the workflow tags main with it. A v* tag
# pushed by hand (git tag v0.1.0 && git push origin v0.1.0) releases that tag the same way. Both
# run CI (tests, sake.wasm and the page, host/tests), then GoReleaser builds ippai for Linux
# x86-64 and ARM64 with the page built in, smoke-tests it and puts the archives, checksums.txt and
# SBOMs on GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # manual releases only from main
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # sake.wasm and the page CI built (the same for every target): built into the binaries
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist

      - name: Setup svu
        if: github.event_name == 'workflow_dispatch'
        uses: freerangebytes/setup-svu@3dcc2ead4b6be1287f9bfe2ac4764a826c110a4f # v0.2.1

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          version="$(svu "$BUMP_TYPE")"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$version"
          git push origin "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Created release tag: $version"

      - name: Rust targets
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: anchore/sbom-action/download-syft@v0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/ippai/target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && steps.tag.outputs.version
                || github.ref_name }}
