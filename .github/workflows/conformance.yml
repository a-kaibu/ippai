# Conformance against outside references:
#  - winetest: Wine's own conformance tests (dlls/<dll>/tests of the Wine release pinned in
#    tests/winetest/build.sh, built with mingw-w64 the way Wine builds them) run on sake's node
#    build, compared with tests/winetest/expected-<arch>.tsv. Fails when a test gets worse.
#    The test programs are cached per Wine version and dll list; nothing of Wine is committed.
#  - diff: random GDI drawing into DIB sections on Wine's GDI (the reference) and on sake,
#    hash by hash (tests/diff/gdi.py, known differences in tests/diff/gdi-expected.txt); SSE
#    and x87 operations on boundary and random operands in every rounding mode on the real CPU
#    (the program under Wine runs natively) and on sake (tests/diff/fpu.py).
name: Conformance

#
# On main one run at a time with only the newest commit waiting (a running one is not cancelled:
# with threads pushing minutes apart, cancelling meant no run ever finished). Nightly and on
# release tags too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "7 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      # (rust-src and the emscripten std, per stable rustc)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - run: tools/ci/rust-wasm.sh
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-sake-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/emsdk.sh') }}
          restore-keys: |
            conformance-sake-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/emsdk.sh') }}-
            conformance-sake-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: sake (node build)
        run: |
          . tools/ci/emsdk.sh
          OUT=$PWD/target/sake-out WEB_OUT=$PWD/target/sake-web bash crates/sake/build.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sake-node
          path: |
            target/sake-out/sake.js
            target/sake-out/sake.wasm
            target/sake-web
          retention-days: 3
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  winetest-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - id: key
        run: echo "key=winetest-${{ hashFiles('tests/winetest/build.sh', 'tests/winetest/dlls.txt') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: cache
        with:
          path: target/winetest/bin
          key: ${{ steps.key.outputs.key }}
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-flex-bison
      - name: Build Wine's tests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/ci/apt.sh mingw-w64 flex bison
          tests/winetest/build.sh
          rm -rf target/winetest/build target/winetest/wine-*
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/winetest/bin
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-flex-bison
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: winetest-bin
          path: target/winetest/bin
          retention-days: 3

  winetest:
    needs: [sake, winetest-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, x86_64]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sake-node
          path: target
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winetest-bin
          path: target/winetest/bin
      - name: Wine's tests on sake (shard ${{ matrix.shard }} of 2)
        run: python3 tests/winetest/run.py --arch ${{ matrix.arch }} --shard ${{ matrix.shard }}/2 -j 4 --timeout 120
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winetest-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            target/winetest/report-*.md
            target/winetest/results-*.tsv
          retention-days: 14

  # the dlls of tests/winetest/browser.txt (Direct3D, DXGI, Direct2D, DirectDraw, OpenGL) need
  # WebGPU: headless Chromium through play.html, served by ippai
  winetest-gpu:
    needs: [sake, winetest-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-winetest-gpu-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-winetest-gpu-
      - run: tools/ci/pnpm.sh
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sake-node
          path: target
      - uses: actions/download-artifact@v8.0.2
        with:
          name: winetest-bin
          path: target/winetest/bin
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: conformance-ippai-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            conformance-ippai-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            conformance-ippai-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (Playwright's Chromium, per Playwright version; the runner image has its libraries, as Bench found: no apt)
      - id: cache-4
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-5
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-fonts-ipafont-gothic-fonts-ipafont-mincho
      - id: cache-6
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-fonttools==4.59.0
      - name: Browser, fonts, the page and ippai
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && pnpm add --dir "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          tools/ci/apt.sh fonts-ipafont-gothic fonts-ipafont-mincho
          tools/ci/pip.sh fonttools==4.59.0
          mkdir -p "$RUNNER_TEMP/fonts" && python3 tools/ci/sake-fonts.py "$RUNNER_TEMP/fonts"
          mkdir -p web/public/sake && cp target/sake-web/* web/public/sake/
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)
          cargo build --release -p ippai
      - if: steps.cache-4.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - if: steps.cache-5.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-fonts-ipafont-gothic-fonts-ipafont-mincho
      - if: steps.cache-6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-fonttools==4.59.0
      - name: Wine's GPU tests on sake in Chromium
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          FONTS: ${{ runner.temp }}/fonts
          WEB: ${{ github.workspace }}/web/dist
          SAKE: target/sake-out/sake.js
        run: python3 tests/winetest/run.py --browser --arch i386 -j 3 --timeout 180
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: winetest-gpu-i386
          path: |
            target/winetest/report-*.md
            target/winetest/results-*.tsv
          retention-days: 14
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target/release
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  diff:
    needs: [sake]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sake-node
          path: target
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-7
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-wine-wine32_i386
      - name: Wine (the reference) and mingw-w64
        run: |
          sudo dpkg --add-architecture i386
          tools/ci/apt.sh mingw-w64 wine wine32:i386
      - if: steps.cache-7.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-wine-wine32_i386
      - name: GDI drawing, sake against Wine
        run: python3 tests/diff/gdi.py
      - name: Floating point, sake against the CPU
        if: always()
        run: python3 tests/diff/fpu.py
