# Formal verification of the graphics paths (formal/): TLC model checks of the protocols between
# guest threads and the render thread (formal/tla), Kani proofs of the format arithmetic, the
# tests around unsafe memory handoff under Miri, and the shader conformance cases
# (crates/shaderconf: the translators' WGSL run on WebGPU against the D3D / GL rules). The exhaustive reference tests (every texel of
# the 16-bit formats, every f32 to f16, every DXT endpoint pair) run with cargo test in CI.
name: Formal

#
# On main only the newest cumulative revision runs. Timeouts are a few times each
# job's usual time: a hung job used to hold the group (and its runner) for the 6 h maximum while
# every later commit's run waited and was dropped. Nightly and on release tags too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # (yashikota/tlc-static: static TLC without a JVM; checksum of the linux-amd64 archive)
      TLC_VERSION: v2026.11.02.163154
      TLC_SHA256: 84f1e3bf90cf845f0be2f3505a1f93673175122e8dbe76c092ce69f129f28cbc
    steps:
      - uses: actions/checkout@v7.0.1
      - id: tlc
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.local/bin/tlc
          key: tlc-${{ env.TLC_VERSION }}-${{ env.TLC_SHA256 }}
      - name: TLC
        if: steps.tlc.outputs.cache-hit != 'true'
        run: |
          curl -sSLf --retry 4 -o /tmp/tlc.tgz "https://github.com/yashikota/tlc-static/releases/download/$TLC_VERSION/tlc-linux-amd64.tar.gz"
          echo "$TLC_SHA256  /tmp/tlc.tgz" | sha256sum -c
          mkdir -p ~/.local/bin && tar xzf /tmp/tlc.tgz -C ~/.local/bin tlc
      - if: steps.tlc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.local/bin/tlc
          key: tlc-${{ env.TLC_VERSION }}-${{ env.TLC_SHA256 }}
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tlc-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            tlc-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            tlc-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Model checks
        run: TLC=~/.local/bin/tlc formal/run.sh
      # (kura's real D3D9/D3D11/GL code, random calls, each run checked against its spec in formal/tla)
      - name: Trace checks
        run: IPPAI_TRACE_SEEDS=200 KEEP=$RUNNER_TEMP/failed-traces TLC=~/.local/bin/tlc formal/trace.sh
      - name: Keep failing traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-traces
          path: ${{ runner.temp }}/failed-traces
          if-no-files-found: ignore
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
            ~/.rustup/toolchains/nightly-20*
            ~/.rustup/update-hashes/nightly-20*
            ~/.cargo/registry
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: kani-${{ runner.os }}-${{ env.KANI_VERSION }}-
      - name: Kani
        run: |
          command -v cargo-kani || cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: Proofs
        run: formal/kani.sh

  # (every interleaving of the Win32 lock words, crates/waits: formal/loom.sh)
  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/loom
          key: loom-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            loom-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Interleavings
        # (deeper on the daily run)
        run: LOOM_MAX_PREEMPTIONS=${{ github.event_name == 'schedule' && '4' || '3' }} formal/loom.sh
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target/loom
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/loom
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # (Verus: unbounded proofs of small algorithms, formal/verus.sh; the latest release, cached
  # under its tag, with the rust toolchain it asks for)
  verus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Release
        run: echo "VERUS_TAG=$(gh api repos/verus-lang/verus/releases/latest --jq .tag_name)" >> "$GITHUB_ENV"
      - id: verus
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/verus
          key: verus-${{ env.VERUS_TAG }}
      - name: Fetch Verus
        if: steps.verus.outputs.cache-hit != 'true'
        run: |
          gh release download "$VERUS_TAG" -R verus-lang/verus -p '*x86-linux*.zip' -D /tmp/verus
          mkdir -p ~/verus && unzip -q /tmp/verus/*.zip -d ~/verus
      - name: Toolchain
        run: |
          V=$(ls -d ~/verus/*/verus | head -1)
          echo "VERUS=$V" >> "$GITHUB_ENV"
          # (the toolchain this release was built against: it names it when missing)
          out=$("$V" --version 2>&1) || true
          echo "$out"
          tc=$(echo "$out" | grep -oE 'rustup (toolchain )?install [^ `]+' | awk '{print $NF}' | head -1)
          if [ -n "$tc" ]; then rustup toolchain install --profile minimal "$tc"; fi
      - name: Proofs
        run: formal/verus.sh

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      # (the nightly toolchain, downloaded once a week: tools/ci/nightly.sh)
      - id: cache-2
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
            ~/.cache/miri
          key: rust-nightly-miri-rust-src-${{ env.CI_WEEK }}
      - name: Miri
        run: tools/ci/nightly.sh miri rust-src
      - if: steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
            ~/.cache/miri
          key: rust-nightly-miri-rust-src-${{ env.CI_WEEK }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: miri-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            miri-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            miri-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Tests under Miri
        run: formal/miri.sh
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target/miri
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # (the render optimizations against plain execution on the WebGPU model, render/model.rs:
  # many more random command streams than cargo test runs)
  render-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: render-model-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-model-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            render-model-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Optimized and plain runs draw the same
        run: IPPAI_MODEL_SEEDS=100000 cargo test --release -p kura --lib optimizations_draw_the_same -- --nocapture
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-shaders-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-shaders-
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: shaders-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            shaders-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            shaders-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (Playwright's Chromium, per Playwright version; the runner image has its libraries, as Bench found: no apt)
      - id: cache-3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && pnpm add --dir "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
      - if: steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Cases
        run: cargo run -q --release -p shaderconf > "$RUNNER_TEMP/cases.json"
      - name: Run on WebGPU
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          OUT: ${{ runner.temp }}/shaders-report.json
        run: node tests/shaders.mjs "$RUNNER_TEMP/cases.json"
      # (compute shaders: the NVIDIA Image Scaling SDK's shader through hlslc and dxwgsl next to
      # Slang's translation of it, tests/compute/slang, on the same inputs: within a byte)
      - name: Compute shaders on WebGPU
        if: always()
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          ./target/release/shaderconf --compute > "$RUNNER_TEMP/compute.json"
          node tests/compute.mjs "$RUNNER_TEMP/compute.json"
      # (mutated DXBC and D3D9 bytecode with the reference interpreters' results as the
      # expected pixels: dxwgsl's WGSL must compute what the instructions do; a fixed seed,
      # then one that changes per run)
      - name: Interpreter oracle on WebGPU
        if: always()
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          # (a failing case fails the step: the grep alone would hide node's exit code)
          set -o pipefail
          ./target/release/shaderconf --oracle 20000 7 > "$RUNNER_TEMP/oracle.json"
          node tests/shaders.mjs "$RUNNER_TEMP/oracle.json" | grep -v '^ok '
          echo "seed ${{ github.run_number }}"
          ./target/release/shaderconf --oracle 20000 ${{ github.run_number }} > "$RUNNER_TEMP/oracle2.json"
          node tests/shaders.mjs "$RUNNER_TEMP/oracle2.json" | grep -v '^ok '
      # (mutated sources and bytecode through the translators: no panic, hang, huge
      # allocation or invalid WGSL; a fixed seed, then one that changes per run)
      - name: Fuzz the translators
        if: always()
        run: |
          ulimit -v 6000000
          # (a stack overflow aborts without a report: the input it was on is in fuzz-last.txt)
          export SHADERCONF_FUZZ_LAST="$RUNNER_TEMP/fuzz-last.txt"
          ./target/release/shaderconf --fuzz 300000 7 > "$RUNNER_TEMP/fuzz.txt" || { cat "$RUNNER_TEMP/fuzz.txt"; echo "---- last input"; cat "$SHADERCONF_FUZZ_LAST"; exit 1; }
          tail -1 "$RUNNER_TEMP/fuzz.txt"
          echo "seed ${{ github.run_number }}"
          ./target/release/shaderconf --fuzz 300000 ${{ github.run_number }} > "$RUNNER_TEMP/fuzz2.txt" || { cat "$RUNNER_TEMP/fuzz2.txt"; echo "---- last input"; cat "$SHADERCONF_FUZZ_LAST"; exit 1; }
          tail -1 "$RUNNER_TEMP/fuzz2.txt"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: shaders-report
          path: ${{ runner.temp }}/shaders-report.json
          retention-days: 14
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
