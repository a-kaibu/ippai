# Coverage-guided fuzzing (fuzz/README.md): every cargo-fuzz target in fuzz/ and crates/*/fuzz/,
# a minute each on every push to main, five minutes each (and the corpus shrunk) once a day,
# three targets at a time (fuzz/run.sh JOBS).
# The corpus is kept in the Actions cache from run to run; crash inputs go up as an artifact.
name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "300"

permissions:
  contents: read

concurrency:
  # Main pushes fuzz the newest cumulative revision, not obsolete queued builds.
  # The nightly/manual runs have their own group and are not replaced by pushes.
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      # (the nightly toolchain, downloaded once a week: tools/ci/nightly.sh)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
          key: rust-nightly-minimal-${{ env.CI_WEEK }}
      - run: tools/ci/nightly.sh
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
          key: rust-nightly-minimal-${{ env.CI_WEEK }}
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-2
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib-imagemagick
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
            crates/*/fuzz/target
          key: fuzz-build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'crates/*/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'crates/*/fuzz/Cargo.lock') }}-
            fuzz-build-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Tools
        run: |
          tools/ci/apt.sh gcc-multilib imagemagick
          command -v cargo-fuzz || cargo install --locked cargo-fuzz --version 0.13.2
      - if: steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib-imagemagick
      # (saved after the job under a new key when it passes; a failing run's corpus is not
      # kept, its crash inputs are uploaded)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            fuzz/corpus
            crates/*/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        env:
          MERGE: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # (three targets at once on the 4 cores; x86_jit maps 4 GB of guest memory, -rss_limit_mb 4 GB each)
          JOBS: "3"
        run: fuzz/run.sh ${{ inputs.seconds || (github.event_name == 'schedule' && '300') || '60' }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            fuzz/artifacts
            crates/*/fuzz/artifacts
          retention-days: 30
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py fuzz/target crates/*/fuzz/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
            crates/*/fuzz/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
