# Trial games' Direct3D calls (tests/replay/games.txt: ids of tests/corpus/titles.tsv) recorded
# with apitrace on Windows, once, into tests/replay/games/ (a commit on main): winref then builds
# each into a probe of its own (replay_<id>-<bits>: tests/replay/build.sh), takes Windows'
# answers for it once and checks sake against them on every push, as for the probes' traces
# (docs/replay.md, "Games"). Nobody runs the games again unless asked (`again`).
#   prep    downloads and unpacks each trial (tests/corpus-prep.sh), finds its API and width
#           (tests/replay/gameapi.py)
#   record  on Windows: the game under apitrace for `seconds` to its title screen
#           (tests/replay/record-game.ps1), zstd, in parts under 100 MB (GitHub's limit)
#   commit  the traces that convert (the apitrace crate) into tests/replay/games
name: Game traces

on:
  push:
    branches: [main]
    paths:
      - 'tests/replay/games.txt'
  workflow_dispatch:
    inputs:
      only:
        description: "only these title ids (space-separated; default tests/replay/games.txt)"
        default: ""
      seconds:
        description: "seconds each game runs under apitrace"
        default: "60"
      again:
        description: "record the titles that have a trace already too"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: gametrace
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          AGAIN: ${{ inputs.again }}
        run: |
          python3 tests/replay/games_test.py
          ids=$(python3 tests/replay/games.py todo ${AGAIN:+--again=$AGAIN} $ONLY)
          echo "ids=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $ids)" >> "$GITHUB_OUTPUT"
          echo "to record: $ids"

  prep:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # (most trials come from one home-run mirror: tests/corpus/ci.sh)
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools
      - run: tools/ci/apt.sh unar unrar innoextract convmv p7zip-full msitools
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools
      - run: python3 tests/replay/gameapi_test.py
      - name: Download ${{ matrix.id }}
        env:
          ID: ${{ matrix.id }}
        run: |
          IFS=$'\t' read -r url exe < <(awk -F'\t' -v i="$ID" '$1 == i { print $5 "\t" $6 }' tests/corpus/titles.tsv)
          export TRIALS=$RUNNER_TEMP/trials DL_TRIES=3
          e=$(bash tests/corpus-prep.sh "$ID" "$url" "$exe" "")
          g=$TRIALS/$ID/x
          read -r api bits < <(python3 -I tests/replay/gameapi.py "$g" "$e")
          echo "$ID: $e: $api, $bits-bit"
          mkdir -p game && mv "$g" game/x
          printf '%s\n%s\n%s\n' "$api" "$bits" "$e" > game/meta.txt
          # (a game without D3D8/9/11: only its meta goes on)
          [ "$api" = none ] && rm -rf game/x
          true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game-${{ matrix.id }}
          path: game
          retention-days: 2

  record:
    needs: [plan, prep]
    if: ${{ !cancelled() && needs.plan.outputs.ids != '[]' }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: game
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: game-${{ matrix.id }}
          path: game
      - id: meta
        shell: bash
        run: |
          [ -f game/meta.txt ] || { echo "no game (its download failed)"; echo "api=none" >> "$GITHUB_OUTPUT"; exit 0; }
          { read -r api; read -r bits; read -r exe; } < game/meta.txt
          echo "${{ matrix.id }}: $api $bits-bit $exe"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "bits=$bits" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      # (d3dx9_*.dll and the other DirectX 9 runtime DLLs games bring no copy of: Microsoft's
      # June 2010 redistributable, cached)
      - if: steps.meta.outputs.api != 'none'
        uses: actions/cache@v6.1.0
        with:
          path: ~/dxredist.exe
          key: directx-jun2010-redist
      - name: DirectX runtime
        if: steps.meta.outputs.api != 'none'
        shell: bash
        run: |
          [ -s ~/dxredist.exe ] || curl -sSfL -o ~/dxredist.exe https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe
          sha256sum ~/dxredist.exe
          ~/dxredist.exe /Q "/T:C:\\dxredist"
          /c/dxredist/DXSETUP.exe /silent || echo "DXSETUP exit $?"
          ls /c/Windows/SysWOW64/d3dx9_43.dll /c/Windows/System32/d3dx9_43.dll || true
      - name: apitrace
        if: steps.meta.outputs.api != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BITS: ${{ steps.meta.outputs.bits }}
        run: |
          a=win32; [ "$BITS" = 64 ] && a=win64
          gh release view -R apitrace/apitrace --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets"
          n=$(sh tests/replay/asset.sh $a < "$RUNNER_TEMP/assets")
          gh release download -R apitrace/apitrace --pattern "$n" -D "$RUNNER_TEMP/at"
          (cd "$RUNNER_TEMP/at" && 7z x -y ./*-$a.7z > /dev/null)
          f=$(find "$RUNNER_TEMP/at" -name apitrace.exe | head -1)
          [ -n "$f" ] || { echo "no apitrace.exe in the $a build"; exit 1; }
          echo "APITRACE=$(cygpath -w "$f")" >> "$GITHUB_ENV"
      - name: Record ${{ matrix.id }}
        if: steps.meta.outputs.api != 'none'
        shell: pwsh
        env:
          API: ${{ steps.meta.outputs.api }}
          EXE: ${{ steps.meta.outputs.exe }}
          SECONDS_: ${{ inputs.seconds || '60' }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          tests/replay/record-game.ps1 -Apitrace $env:APITRACE -Api $env:API -Exe "game/x/$env:EXE" -Out out/game.trace -Seconds ([int]$env:SECONDS_)
      - name: What was recorded
        if: steps.meta.outputs.api != 'none'
        shell: bash
        env:
          ID: ${{ matrix.id }}
          API: ${{ steps.meta.outputs.api }}
          BITS: ${{ steps.meta.outputs.bits }}
          EXE: ${{ steps.meta.outputs.exe }}
          SECONDS_: ${{ inputs.seconds || '60' }}
        run: |
          mkdir -p pack
          mv out/game.trace "pack/$ID-$BITS.trace"
          printf '%s\n' "$API" "$EXE" "$SECONDS_" > "pack/$ID-$BITS.rec"
          ls -l pack
      - if: steps.meta.outputs.api != 'none'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trace-${{ matrix.id }}
          path: pack
          retention-days: 7

  # the traces into tests/replay/games (a commit on main): only those the converter takes
  commit:
    needs: [plan, record]
    if: ${{ !cancelled() && needs.plan.outputs.ids != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: trace-*
          path: pack
          merge-multiple: true
      # (only a trace the converter takes; zstd, in parts under GitHub's 100 MB: games.py)
      - name: Convert (the check) and pack
        run: |
          python3 tests/replay/games_test.py
          cargo build -q --release -p apitrace
          mkdir -p ok
          for r in pack/*.rec; do
            n=$(basename "$r" .rec)
            { read -r api; read -r exe; read -r secs; } < "$r"
            if target/release/apitrace "pack/$n.trace" "$RUNNER_TEMP/$n.rpl"; then
              python3 tests/replay/games.py pack "pack/$n.trace" "ok/$n" --api "$api" --exe "$exe" --seconds "$secs"
              python3 tests/replay/games.py unpack "ok/$n" "$RUNNER_TEMP/check.trace" && cmp "$RUNNER_TEMP/check.trace" "pack/$n.trace"
            else
              echo "$n: does not convert, not committed"
            fi
            rm -f "$RUNNER_TEMP/$n.rpl" "$RUNNER_TEMP/check.trace"
          done
          ls -l ok
      - name: Commit the traces
        run: |
          ls ok/*.txt > /dev/null 2>&1 || { echo "nothing to commit"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            mkdir -p "$M/tests/replay/games"
            took=
            for m in ok/*.txt; do
              n=$(basename "$m" .txt)
              # (a title recorded again: its old parts go)
              rm -f "$M/tests/replay/games/$n".*
              cp ok/"$n".* "$M/tests/replay/games/"
              took="$took $n"
            done
            git -C "$M" add -A tests/replay/games
            if git -C "$M" diff --cached --quiet; then echo "no change"; exit 0; fi
            git -C "$M" commit -qm "replay: apitrace traces of trial games:${took} (${GITHUB_SHA::7})"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
