# Trial games' Direct3D calls (tests/replay/games.txt: ids of tests/corpus/titles.tsv) recorded
# with apitrace on Windows, once, onto ghcr.io (tests/replay/games.py; testdata/apitrace/ says what
# and where, a commit on main): winref then builds
# each into a probe of its own (replay_<id>-<bits>: tests/replay/build.sh), takes Windows'
# answers for it once and checks sake against them on every push, as for the probes' traces
# (docs/replay.md, "Games"). Nobody runs the games again unless asked (`again`).
#   prep    downloads and unpacks each trial (tests/corpus-prep.sh), finds its API and width
#           (tests/replay/gameapi.py)
#   record  on Windows: the game under apitrace, played as corpusref.yml plays it (Japanese
#           fonts, a sound card, tests/corpus/winplay.py: to its title screen, its steps, then
#           `seconds` of story clicks; tests/replay/record-game.ps1)
#   commit  the traces that convert (the apitrace crate) onto ghcr.io/a-kaibu/ippai-traces (zstd,
#           a public package: free, no size limit), their .txt into testdata/apitrace
#   migrate traces still in parts in the repository (the old way) onto ghcr.io
name: Game traces

on:
  push:
    branches: [main]
    paths:
      - 'tests/replay/games.txt'
      - 'tests/replay/games.py'
  # (100 titles a run: each night takes the next until all of games.txt has a trace or a reason)
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: "only these title ids (space-separated; default tests/replay/games.txt)"
        default: ""
      seconds:
        description: "seconds of story clicks after the title screen (tests/corpus/winplay.py STORY)"
        default: "30"
      again:
        description: "record the titles that have a trace already too"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: gametrace
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          AGAIN: ${{ inputs.again }}
        run: |
          python3 tests/replay/games_test.py
          pwsh -NoProfile -File tests/replay/ps1-parse.ps1
          ids=$(python3 tests/replay/games.py todo --max=100 ${AGAIN:+--again=$AGAIN} $ONLY)
          echo "ids=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $ids)" >> "$GITHUB_OUTPUT"
          echo "to record: $ids"

  prep:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # (most trials come from one home-run mirror: tests/corpus/ci.sh)
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools
      - run: tools/ci/apt.sh unar unrar innoextract convmv p7zip-full msitools
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-unar-unrar-innoextract-convmv-p7zip-full-msitools
      - run: python3 tests/replay/gameapi_test.py
      - name: Download ${{ matrix.id }}
        env:
          ID: ${{ matrix.id }}
        run: |
          IFS=$'\t' read -r url exe < <(awk -F'\t' -v i="$ID" '$1 == i { print $5 "\t" $6 }' tests/corpus/titles.tsv)
          export TRIALS=$RUNNER_TEMP/trials DL_TRIES=3
          e=$(bash tests/corpus-prep.sh "$ID" "$url" "$exe" "")
          g=$TRIALS/$ID/x
          read -r api bits < <(python3 -I tests/replay/gameapi.py "$g" "$e")
          echo "$ID: $e: $api, $bits-bit"
          mkdir -p game && mv "$g" game/x
          printf '%s\n%s\n%s\n' "$api" "$bits" "$e" > game/meta.txt
          python3 tests/corpus/winplay.py meta tests/corpus/titles.tsv "$ID" "$e" game/meta.json
          # (a game without D3D8/9/11: only its meta goes on)
          [ "$api" = none ] && rm -rf game/x
          true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game-${{ matrix.id }}
          path: game
          retention-days: 2

  record:
    needs: [plan, prep]
    if: ${{ !cancelled() && needs.plan.outputs.ids != '[]' }}
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: game
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: game-${{ matrix.id }}
          path: game
      - id: meta
        shell: bash
        run: |
          [ -f game/meta.txt ] || { echo "no game (its download failed: tried again next time)"; echo "api=none" >> "$GITHUB_OUTPUT"; exit 0; }
          { read -r api; read -r bits; read -r exe; } < game/meta.txt
          echo "${{ matrix.id }}: $api $bits-bit $exe"
          # (a title that draws without D3D8/9/11: skipped.tsv, not downloaded again)
          mkdir -p pack
          if [ "$api" = none ]; then printf 'none\t%s: no D3D8/9/11\n' "$exe" > "pack/${{ matrix.id }}.skip"; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "bits=$bits" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      # (d3dx9_*.dll and the other DirectX 9 runtime DLLs games bring no copy of: Microsoft's
      # June 2010 redistributable, cached)
      - if: steps.meta.outputs.api != 'none'
        uses: actions/cache@v6.1.0
        with:
          path: ~/dxredist.exe
          key: directx-jun2010-redist
      # (PowerShell: Git Bash would turn /Q and /silent into paths. The self-extractor and
      # DXSETUP each get a time limit; a game that brings its own d3dx9 DLLs goes on without it)
      - name: DirectX runtime
        if: steps.meta.outputs.api != 'none'
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if (-not (Test-Path ~/dxredist.exe)) { Invoke-WebRequest -Uri https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe -OutFile ~/dxredist.exe }
          (Get-FileHash ~/dxredist.exe).Hash
          $x = Start-Process -FilePath (Resolve-Path ~/dxredist.exe) -ArgumentList '/Q', '/T:C:\dxredist' -PassThru
          if (-not $x.WaitForExit(180000)) { Stop-Process -Id $x.Id -Force; throw "the redistributable did not unpack" }
          $d = Start-Process -FilePath C:\dxredist\DXSETUP.exe -ArgumentList '/silent' -PassThru
          if (-not $d.WaitForExit(300000)) { Stop-Process -Id $d.Id -Force; throw "DXSETUP did not finish" }
          "DXSETUP exit $($d.ExitCode)"
          Get-Item C:\Windows\SysWOW64\d3dx9_43.dll, C:\Windows\System32\d3dx9_43.dll -ErrorAction SilentlyContinue | Select-Object FullName, Length
      - name: apitrace
        if: steps.meta.outputs.api != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BITS: ${{ steps.meta.outputs.bits }}
        run: |
          a=win32; [ "$BITS" = 64 ] && a=win64
          gh release view -R apitrace/apitrace --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets"
          n=$(sh tests/replay/asset.sh $a < "$RUNNER_TEMP/assets")
          gh release download -R apitrace/apitrace --pattern "$n" -D "$RUNNER_TEMP/at"
          (cd "$RUNNER_TEMP/at" && 7z x -y ./*-$a.7z > /dev/null)
          f=$(find "$RUNNER_TEMP/at" -name apitrace.exe | head -1)
          [ -n "$f" ] || { echo "no apitrace.exe in the $a build"; exit 1; }
          echo "APITRACE=$(cygpath -w "$f")" >> "$GITHUB_ENV"
      # (as corpusref.yml: MS Gothic and the other Japanese fonts, a feature on demand on an English
      # Windows; a sound card, without which DirectSound fails and games stop at an error box:
      # Scream, github.com/duncanthrax/scream, its author's certificate trusted)
      - name: Japanese fonts
        if: steps.meta.outputs.api != 'none'
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          if (Test-Path C:\Windows\Fonts\msgothic.ttc) { "MS Gothic is there"; exit 0 }
          $j = Start-Job { Add-WindowsCapability -Online -Name 'Language.Fonts.Jpan~~~und-JPAN~0.0.1.0' }
          if (-not (Wait-Job $j -Timeout 600)) { Stop-Job $j; throw "the Japanese fonts did not install in 10 minutes" }
          Receive-Job $j
          "msgothic.ttc: $(Test-Path C:\Windows\Fonts\msgothic.ttc)"
      - name: Virtual sound card
        if: steps.meta.outputs.api != 'none'
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile Scream4.0.zip
          "Scream4.0.zip sha256 $((Get-FileHash Scream4.0.zip).Hash)"
          Expand-Archive -Path Scream4.0.zip -DestinationPath Scream
          $sys = Get-ChildItem -Recurse Scream -Filter Scream.sys | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $cert = (Get-AuthenticodeSignature $sys.FullName).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          $devcon = Get-ChildItem -Recurse Scream -Filter devcon-x64.exe | Select-Object -First 1
          Push-Location $sys.DirectoryName
          $p = Start-Process -FilePath $devcon.FullName -ArgumentList 'install', 'Scream.inf', '*Scream' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "devcon did not finish" }
          Pop-Location
          "devcon exit $($p.ExitCode)"
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          Get-CimInstance Win32_SoundDevice | Select-Object Name, Status
      - name: Windows
        if: steps.meta.outputs.api != 'none'
        shell: pwsh
        run: python tests/corpus/winplay.py setup
      - name: Record ${{ matrix.id }}
        id: rec
        if: steps.meta.outputs.api != 'none'
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 15
        env:
          API: ${{ steps.meta.outputs.api }}
          STORY_: ${{ inputs.seconds || '30' }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          tests/replay/record-game.ps1 -Apitrace $env:APITRACE -Api $env:API -Game game -Out out/game.trace -Shots shots -Story ([int]$env:STORY_)
      # (what the game got to: winplay's pictures, for a look; never committed)
      - if: ${{ !cancelled() && steps.meta.outputs.api != 'none' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shots-${{ matrix.id }}
          path: shots
          retention-days: 7
          if-no-files-found: ignore
      # (no trace: skipped.tsv says so, with how far winplay got)
      - name: What was recorded
        if: ${{ !cancelled() && steps.meta.outputs.api != 'none' }}
        shell: bash
        env:
          ID: ${{ matrix.id }}
          API: ${{ steps.meta.outputs.api }}
          BITS: ${{ steps.meta.outputs.bits }}
          EXE: ${{ steps.meta.outputs.exe }}
          SECONDS_: ${{ inputs.seconds || '30' }}
        run: |
          mkdir -p pack
          if [ -f out/game.trace ]; then
            # (the API it was recorded with: record-game.ps1 may have tried another than gameapi's)
            api=$(cat out/game.trace.api 2>/dev/null || echo "$API")
            mv out/game.trace "pack/$ID-$BITS.trace"
            printf '%s\n' "$api" "$EXE" "$SECONDS_" > "pack/$ID-$BITS.rec"
          else
            how=$(python3 -c 'import json, sys; r = json.load(open(sys.argv[1], encoding="utf-8")); print("title screen at %ss" % round(r["title"]) if r.get("title") else "no title screen" + (", ended" if r.get("crashed") else ""))' shots/result.json 2>/dev/null || echo "winplay wrote nothing")
            # (record-game.ps1 itself failed: no .why, nothing written down, tried again next time)
            if { IFS=$'\t' read -r why what || [ -n "$why" ]; } < out/game.trace.why; then
              printf '%s\t%s: %s; %s\n' "$why" "$EXE" "$how" "$what" > "pack/$ID.skip"
            else
              echo "record-game.ps1 left no reason: not skipped"
            fi
          fi
          ls -l pack; cat pack/*.skip 2>/dev/null || true
      - if: ${{ !cancelled() && hashFiles('pack/*') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trace-${{ matrix.id }}
          path: pack
          retention-days: 7

  # traces still in parts in the repository (before 2026-11-07's move): onto ghcr.io, their
  # parts out of testdata/apitrace (a commit on main); nothing to do once all have moved
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Migrate
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          python3 tests/replay/games_test.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            moved=$(python3 tests/replay/games.py migrate "$M/testdata/apitrace")
            echo "$moved"
            git -C "$M" add -A testdata/apitrace
            if git -C "$M" diff --cached --quiet; then exit 0; fi
            # (each pulls back as it was before its parts go)
            for n in $moved; do python3 tests/replay/games.py unpack "$M/testdata/apitrace/$n" "$RUNNER_TEMP/check.trace"; done
            git -C "$M" commit -qm "replay: trial games' traces onto ghcr.io: $moved (${GITHUB_SHA::7})"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  # the traces onto ghcr.io, their .txt into testdata/apitrace (a commit on main): only those the
  # converter takes
  commit:
    needs: [plan, record, migrate]
    if: ${{ !cancelled() && needs.plan.outputs.ids != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: trace-*
          path: pack
          merge-multiple: true
      # (only a trace the converter takes; zstd, onto ghcr.io: games.py)
      - name: Convert (the check) and push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          python3 tests/replay/games_test.py
          cargo build -q --release -p apitrace
          mkdir -p ok
          shopt -s nullglob
          for r in pack/*.rec; do
            n=$(basename "$r" .rec)
            { read -r api; read -r exe; read -r secs; } < "$r"
            if target/release/apitrace "pack/$n.trace" "$RUNNER_TEMP/$n.rpl"; then
              python3 tests/replay/games.py push "pack/$n.trace" "ok/$n" --api "$api" --exe "$exe" --seconds "$secs"
              # (pulled back from the registry, not the cache: what winref will get)
              TRACES_CACHE=$RUNNER_TEMP/nocache python3 tests/replay/games.py unpack "ok/$n" "$RUNNER_TEMP/check.trace" && cmp "$RUNNER_TEMP/check.trace" "pack/$n.trace"
            else
              echo "$n: does not convert, not committed"
              printf 'noconvert\t%s: %s\n' "$exe" "$api" > "pack/${n%-*}.skip"
            fi
            rm -f "$RUNNER_TEMP/$n.rpl" "$RUNNER_TEMP/check.trace"
          done
          ls -l ok || true
      - name: Commit the traces
        run: |
          shopt -s nullglob
          s=(pack/*.skip) o=(ok/*.txt)
          [ $(( ${#s[@]} + ${#o[@]} )) -gt 0 ] || { echo "nothing to commit"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          M=$RUNNER_TEMP/main
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git worktree remove --force "$M" 2>/dev/null || true
            git worktree add -q --detach "$M" FETCH_HEAD
            mkdir -p "$M/testdata/apitrace"
            took= skip=
            for m in "${o[@]}"; do
              n=$(basename "$m" .txt)
              # (a title recorded again: its old .txt, and parts of the old way, go)
              rm -f "$M/testdata/apitrace/$n".*
              cp "ok/$n.txt" "$M/testdata/apitrace/"
              python3 tests/replay/games.py took "${n%-*}" --dir "$M/testdata/apitrace"
              took="$took $n"
            done
            for k in "${s[@]}"; do
              i=$(basename "$k" .skip)
              IFS=$'\t' read -r why what < "$k"
              python3 tests/replay/games.py skip "$i" "$why" "$what" --dir "$M/testdata/apitrace"
              skip="$skip $i"
            done
            git -C "$M" add -A testdata/apitrace
            if git -C "$M" diff --cached --quiet; then echo "no change"; exit 0; fi
            git -C "$M" commit -qm "replay: apitrace traces of trial games:${took:- none}; skipped:${skip:- none} (${GITHUB_SHA::7})"
            git -C "$M" push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
