# wingfx (wingfx/README.md): the graphics conformance suites' own tests: the case files current,
# the laws (exhaustive and property-based), and the models against Windows' recorded answers
# (tests/winref/golden/wingfx_*, which the winref workflow records on its Windows runner and
# compares sake with).
name: wingfx

on:
  push:
    branches: [main]
    paths:
      - 'wingfx/**'
      - 'tests/winref/golden/wingfx_*/**'
      - 'tests/winref/golden/d3d9state-32/**'
      - '.github/workflows/wingfx.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wingfx-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wingfx/target
          key: wingfx-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('wingfx/Cargo.lock') }}
          restore-keys: |
            wingfx-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Laws, case files, models against Windows
        run: cargo test --manifest-path wingfx/Cargo.toml -- --nocapture 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Summary
        if: always()
        run: grep -E '^wingfx_|test result' test.log >> "$GITHUB_STEP_SUMMARY" || true
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py wingfx/target
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wingfx/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
