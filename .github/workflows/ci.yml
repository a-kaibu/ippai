# CI: every push to main and every pull request runs the Rust tests and builds the whole
# thing (sake.wasm, the page, the ippai binary with the page built in), then runs host/tests
# on sake. The release workflow (release.yml) runs this first and makes the release from its
# web/dist (artifact "web").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # (github.workflow: called from Release, a run of its own beside the push's)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ippai-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/ippai-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser fetch regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/fetch-browser.mjs
      - name: Unstable link (drops, stalls, offline, chunks kept on the device)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/net-browser.mjs
      - name: Bench report (a failed run stays out of the history)
        run: python3 tests/bench/test_report.py
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: browser-${{ runner.os }}-
      - name: Web games run isolated from the app
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: |
          (cd web && npm ci --no-audit --no-fund && npx vp build)
          cargo build -p ippai
          node tests/webgame-isolation.mjs target/debug/ippai
      - name: Installable, and opens offline (service worker)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/offline-browser.mjs target/debug/ippai

  test:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - name: cargo test
        run: cargo test --workspace --release
      # (the C runtime's property tests once more with overflow checks: fuzzing found an
      # overflow that release builds wrap silently)
      - name: crt tests with overflow checks
        run: cargo test -p crt
      - name: Check all Rust targets without warnings
        run: cargo check --workspace --all-targets --locked

  rustfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rustfs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rustfs-${{ runner.os }}-
      - name: Encrypted storage against RustFS
        run: bash tools/ci/test-rustfs.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # (git describe names the build)
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64 zstd clang lld llvm
          rustup component add rust-src
          rustup target add wasm32-unknown-emscripten
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh', 'tools/ci/emsdk.sh') }}
          restore-keys: build-${{ runner.os }}-
      - name: Web check (Oxfmt, Oxlint, types; warnings are errors)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run check && npx vp test
      - name: Fetch ordering tests
        run: node tests/fetch-bridge.test.mjs
      - name: Build
        run: tools/ci/build.sh
      - name: host/tests on sake
        run: SAKE=$PWD/target/sake-out/sake.js tests/host-tests.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ippai
          path: target/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: web/dist
          retention-days: 14

