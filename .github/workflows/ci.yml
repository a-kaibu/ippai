# CI: every push to main and every pull request runs the Rust tests and builds the whole
# thing (sake.wasm, the page, the ippai binary with the page built in), then runs host/tests
# on sake. The release workflow (release.yml) runs this first and makes the release from its
# web/dist (artifact "web").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # (github.workflow: called from Release, a run of its own beside the push's)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-browser-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-browser-
      - run: tools/ci/pnpm.sh
      # (Playwright's Chromium, per Playwright version; the runner image has its libraries, as Bench found: no apt)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/ippai-browser" && pnpm add --dir "$RUNNER_TEMP/ippai-browser" playwright@1.63.0
          "$RUNNER_TEMP/ippai-browser/node_modules/.bin/playwright" install chromium
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      # (the corpus harness: screenshots against Windows' answers, the Windows player's platform-free parts)
      - name: Corpus harness tests
        run: python3 tests/corpus/shots_test.py && python3 tests/corpus/winplay_test.py && python3 tests/corpus/golden_test.py
      - name: Real browser fetch regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/fetch-browser.mjs
      - name: Unstable link (drops, stalls, offline, chunks kept on the device)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/net-browser.mjs
      - name: Bench report (a failed run stays out of the history)
        run: python3 tests/bench/test_report.py
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            browser-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            browser-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Web games run isolated from the app
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)
          cargo build -p ippai
          node tests/webgame-isolation.mjs target/debug/ippai
      - name: Installable, and opens offline (service worker)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/offline-browser.mjs target/debug/ippai
      - name: Saves made offline survive the next online start (saves.ts sync state)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/saves-browser.mjs target/debug/ippai
      - name: Save states wait for WebCodecs' writes (memgate.ts, real decoders)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/webcodecs-snap-browser.mjs
      - name: The chunk cache trimmed by the chunks' real sizes (net.ts trimChunks)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/chunk-trim-browser.mjs
      - name: Save state slots from two devices at once (content-named files, merged index)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/savestate-slots-browser.mjs target/debug/ippai
      - name: Web apps kept for older builds' states (apps.rs)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/apps-browser.mjs target/debug/ippai
      - name: The game list (name, icons, 統計 at the top right, favorites, statistics)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/library-browser.mjs target/debug/ippai
      - name: Sign-in behind a reverse proxy that adds no forwarding header (auth.rs)
        run: python3 tests/auth-proxy.py target/debug/ippai
      - name: The server answers before it has compressed the web app (serve.rs precompress)
        run: python3 tests/serve-start.py target/debug/ippai
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            test-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (SingleStepTests: real-mode tests recorded on a real 80386EX, 80286, 8086, 8088 and
      # NEC V20, ~1.9 GB, which crates/koji/tests/singlestep.rs runs when they are there)
      - id: cache-2
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: Fetch SingleStepTests
        run: tests/sst/fetch.sh
      - if: steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      # (Berkeley TestFloat 3e's testfloat_gen, pinned by build.sh, for
      # crates/koji/tests/testfloat.rs)
      - id: cache-tf
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build TestFloat
        run: tests/testfloat/build.sh
      - if: steps.cache-tf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: cargo test
        run: cargo test --workspace --release
      # (the C runtime's property tests once more with overflow checks: fuzzing found an
      # overflow that release builds wrap silently)
      - name: crt tests with overflow checks
        run: cargo test -p crt
      - name: Check all Rust targets without warnings
        run: cargo check --workspace --all-targets --locked
      # (before the cache is saved: only the registry crates' builds are worth keeping;
      # target/sst and target/testfloat have caches of their own)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: rm -rf target/sst target/testfloat && python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # koji's JITs against its interpreter (random code, run by wasmtime) and the interpreter
  # against the runner's CPU: long mode (jit64test) and 32-bit (jit32test: regions and function
  # mode through its dispatcher; integer/MMX/SSE/x87). One job: the four runs are single-threaded,
  # so they run side by side as background steps on the runner's cores (one runner, not two).
  # koji's x86-64 JIT: 20000 random programs against the interpreter (a new seed per run, in four
  # parts at once: the runner's four cores; one part alone took over 30 minutes), and the
  # interpreter against the runner's CPU
  jit64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit64test/target
          key: jit64-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('tools/jit64test/Cargo.lock') }}
          restore-keys: |
            jit64-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Build jit64test
        working-directory: tools/jit64test
        run: cargo build --release --locked
      - name: Long mode, JIT against the interpreter, part 1 of 4
        id: jit64-diff0
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 0 ))
      - name: Long mode, JIT against the interpreter, part 2 of 4
        id: jit64-diff1
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 1 ))
      - name: Long mode, JIT against the interpreter, part 3 of 4
        id: jit64-diff2
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 2 ))
      - name: Long mode, JIT against the interpreter, part 4 of 4
        id: jit64-diff3
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 3 ))
      - name: Long mode, interpreter against the runner's CPU, one instruction at a time
        id: jit64-native
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test native 30000 ${{ github.run_number }}
      - name: Wait for the five runs
        wait: [jit64-diff0, jit64-diff1, jit64-diff2, jit64-diff3, jit64-native]
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py tools/jit64test/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit64test/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # koji's 32-bit JIT against the interpreter (two parts at once), the runner's CPU and TestFloat
  # (x87/SSE results and MXCSR flags, a sample per instruction and rounding mode); its 16-bit
  # JIT (Win16 code) against its interpreter and real chips (SingleStepTests: 80386, 80286,
  # 8086, 8088, V20; what it translates, SST_N per opcode file)
  jit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit32test/target
            tools/jit16test/target
          key: jit-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('tools/jit32test/Cargo.lock', 'tools/jit16test/Cargo.lock') }}
          restore-keys: |
            jit-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (SingleStepTests for jit16test, pinned by fetch.sh)
      - id: cache-3
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: SingleStepTests
        id: sst
        background: true
        run: tests/sst/fetch.sh
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-4
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib
      - name: gcc-multilib (jit32test native)
        id: apt
        background: true
        run: tools/ci/apt.sh gcc-multilib
      - id: cache-tf
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build TestFloat
        run: tests/testfloat/build.sh
      - if: steps.cache-tf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build jit32test and jit16test
        run: |
          (cd tools/jit16test && cargo build --release --locked) & q=$!
          (cd tools/jit32test && cargo build --release --locked)
          wait $q
      - name: 32-bit, JIT against the interpreter, part 1 of 2
        id: jit32-diff0
        background: true
        working-directory: tools/jit32test
        run: cargo run --release --locked -- 5000 $(( ${{ github.run_number }} * 2 ))
      - name: 32-bit, JIT against the interpreter, part 2 of 2
        id: jit32-diff1
        background: true
        working-directory: tools/jit32test
        run: cargo run --release --locked -- 5000 $(( ${{ github.run_number }} * 2 + 1 ))
      - name: 16-bit, JIT against the interpreter (new seed per run)
        id: jit16-diff
        background: true
        working-directory: tools/jit16test
        run: cargo run --release --locked -- 1500 ${{ github.run_number }}
      - name: 32-bit, JIT against TestFloat
        id: jit32-tf
        background: true
        working-directory: tools/jit32test
        run: cargo run --release --locked -- testfloat
      - wait: sst
      - if: steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: 16-bit, against the chips (SingleStepTests)
        id: jit16-sst
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 cargo run --release --locked -- sst
      - wait: apt
      - if: steps.cache-4.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib
      - name: 32-bit, against the runner's CPU (random rounding modes and precisions)
        id: jit32-native
        background: true
        working-directory: tools/jit32test
        run: cargo run --release --locked -- native 3000 ${{ github.run_number }}
      - name: Wait for the six runs
        wait: [jit32-diff0, jit32-diff1, jit32-native, jit32-tf, jit16-diff, jit16-sst]
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py tools/jit32test/target tools/jit16test/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit32test/target
            tools/jit16test/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  rustfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rustfs-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rustfs-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            rustfs-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Encrypted storage against RustFS
        run: bash tools/ci/test-rustfs.sh
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # (git describe names the build)
      - run: tools/ci/cache-keys.sh
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-5
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-zstd-clang-lld-llvm
      - name: mingw-w64, zstd, clang
        id: apt
        background: true
        run: tools/ci/apt.sh mingw-w64 zstd clang lld llvm
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-build-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-build-
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-key.sh
      # (rust-src and the emscripten std, per stable rustc)
      - id: cache-6
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - run: tools/ci/rust-wasm.sh
      - if: steps.cache-6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh', 'tools/ci/emsdk.sh') }}
          restore-keys: |
            build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh', 'tools/ci/emsdk.sh') }}-
            build-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Web check (Oxfmt, Oxlint, types; warnings are errors)
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run check && pnpm exec vp test
      - name: pnpm only (tools/ci/no-npm.sh)
        run: tools/ci/no-npm.sh
      - name: Fetch ordering tests
        run: node tests/fetch-bridge.test.mjs
      - name: Shared VFS and account bridge tests (host/vnfs.js, host/account-bridge.js)
        run: node --test tests/vfs-shared.mjs tests/account-bridge.mjs
      - wait: apt
      - if: steps.cache-5.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-zstd-clang-lld-llvm
      - name: Build
        run: tools/ci/build.sh
      # (the release's Windows build: pack, add and storage on the PC that has the games)
      - name: ippai for Windows builds without warnings
        run: |
          rustup target add x86_64-pc-windows-gnu
          RUSTFLAGS="-D warnings" cargo build --release -p ippai --target x86_64-pc-windows-gnu
      - name: host/tests on sake
        run: SAKE=$PWD/target/sake-out/sake.js tests/host-tests.sh
      # (the page's fallback build where 4 GB at once is refused: web/src/runtime.ts sakeBuild;
      # and the JIT freeing modules nothing refers to after every load, kura jit.rs reclaim)
      - name: host/tests on sake-grow (a memory that starts at 2.06 GB and grows), JIT modules freed at every load
        run: IPPAI_JIT_RECLAIM=1 SAKE=$PWD/target/sake-out/sake-grow.js tests/host-tests.sh
      - name: Save states under node (cut anywhere, restored, the same output)
        run: SAKE=$PWD/target/sake-out/sake.js tests/snap.sh
      - name: Save states under node on sake-grow (the build a state is of, its memory as large)
        run: SAKE=$PWD/target/sake-out/sake-grow.js EXES=snaptest TIMES="0.7 2.1" tests/snap.sh
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Save states in the page (taken, loaded, loaded on another device)
        run: |
          mkdir -p "$RUNNER_TEMP/ippai-browser" && pnpm add --dir "$RUNNER_TEMP/ippai-browser" playwright@1.63.0
          "$RUNNER_TEMP/ippai-browser/node_modules/.bin/playwright" install chromium
          PLAYWRIGHT=$RUNNER_TEMP/ippai-browser/node_modules/playwright/index.mjs node tests/savestate-browser.mjs target/release/ippai
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ippai
          path: target/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: web/dist
          retention-days: 14

      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
