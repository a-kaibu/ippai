# CI: every push to main and every pull request runs the Rust tests and builds the whole
# thing (sake.wasm, the page, the ippai binary with the page built in), then runs host/tests
# on sake. The release workflow (release.yml) runs this first and makes the release from its
# web/dist (artifact "web").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # (github.workflow: called from Release, a run of its own beside the push's)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - name: cargo test
        run: cargo test --workspace --release

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (git describe names the build)
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64 zstd
          rustup component add rust-src
          rustup target add wasm32-unknown-emscripten
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/emsdk4
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh') }}
          restore-keys: build-${{ runner.os }}-
      - name: Web check
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vp check
      - name: Build
        run: tools/ci/build.sh
      - name: host/tests on sake
        run: SAKE=$PWD/target/sake-out/sake.js tests/host-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ippai
          path: target/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist
          retention-days: 14

