# CI: every push to main and every pull request runs the Rust tests and builds the whole
# thing (sake.wasm, the page, the ippai binary with the page built in), then runs host/tests
# on sake. The release workflow (release.yml) runs this first and makes the release from its
# web/dist (artifact "web").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # (github.workflow: called from Release, a run of its own beside the push's)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-browser-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-browser-
      - run: tools/ci/pnpm.sh
      # (Playwright's Chromium, per Playwright version; the runner image has its libraries, as Bench found: no apt)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/ippai-browser" && pnpm add --dir "$RUNNER_TEMP/ippai-browser" playwright@1.63.0
          "$RUNNER_TEMP/ippai-browser/node_modules/.bin/playwright" install chromium
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      # (the corpus harness: screenshots against Windows' answers, the Windows player's platform-free parts)
      - name: Corpus harness tests
        run: python3 tests/corpus/shots_test.py && python3 tests/corpus/winplay_test.py && python3 tests/corpus/golden_test.py && python3 tests/coverage/usage_test.py
      - name: Real browser fetch regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/fetch-browser.mjs
      - name: Unstable link (drops, stalls, offline, chunks kept on the device)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/net-browser.mjs
      - name: Bench report (a failed run stays out of the history)
        run: python3 tests/bench/test_report.py
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            browser-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            browser-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Web games run isolated from the app
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm exec vp build)
          cargo build -p ippai
          node tests/webgame-isolation.mjs target/debug/ippai
      - name: Installable, and opens offline (service worker)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/offline-browser.mjs target/debug/ippai
      - name: Saves made offline survive the next online start (saves.ts sync state)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/saves-browser.mjs target/debug/ippai
      - name: Save states wait for WebCodecs' writes (memgate.ts, real decoders)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/webcodecs-snap-browser.mjs
      - name: The chunk cache trimmed by the chunks' real sizes (net.ts trimChunks)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/chunk-trim-browser.mjs
      - name: Save state slots from two devices at once (content-named files, merged index)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/savestate-slots-browser.mjs target/debug/ippai
      - name: Web apps kept for older builds' states (apps.rs)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/apps-browser.mjs target/debug/ippai
      - name: The game list (name, icons, 設定 sidebar with server update, app, statistics and reset; order and sections; favorites)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/library-browser.mjs target/debug/ippai
      - name: What is on the device and being saved there (保存 tab, a game's parts, the file being fetched)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/storage-browser.mjs target/debug/ippai
      - name: The browser's back button goes back to the game list (once, from a game picked or opened by its address)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/back-browser.mjs target/debug/ippai
      - name: A game not on the device is saved there whole before it starts (from the bucket many at once, the server at most 4)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/save-first-browser.mjs target/debug/ippai
      - name: A game's information from a pasted 批評空間 / VNDB page (stand-ins for both)
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
        run: node tests/meta-browser.mjs target/debug/ippai
      - name: The game database's update script (tools/gamedb/update.sh, stand-in gh)
        run: sh tests/gamedb-update-sh.sh
      - name: Sign-in behind a reverse proxy that adds no forwarding header (auth.rs)
        run: python3 tests/auth-proxy.py target/debug/ippai
      - name: The server answers before it has compressed the web app (serve.rs precompress)
        run: python3 tests/serve-start.py target/debug/ippai
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            test-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (SingleStepTests: real-mode tests recorded on a real 80386EX, 80286, 8086, 8088 and
      # NEC V20, ~1.9 GB, which crates/koji/tests/singlestep.rs runs when they are there)
      - id: cache-2
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: Fetch SingleStepTests
        run: tests/sst/fetch.sh
      - if: steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      # (Berkeley TestFloat 3e's testfloat_gen, pinned by build.sh, for
      # crates/koji/tests/testfloat.rs)
      - id: cache-tf
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build TestFloat
        run: tests/testfloat/build.sh
      - if: steps.cache-tf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: cargo test
        # (a cold build and the tests take about 12 minutes; a hung fetcher in kura's vfs tests
        # once held the job (and every later run, one at a time on main) for an hour)
        timeout-minutes: 25
        run: cargo test --workspace --release
      # (the C runtime's property tests once more with overflow checks: fuzzing found an
      # overflow that release builds wrap silently)
      - name: crt tests with overflow checks
        run: cargo test -p crt
      - name: Check all Rust targets without warnings
        run: cargo check --workspace --all-targets --locked
      # (the binary cargo test just built: Docker's RustFS stands in for the storage server, so
      # this needs no runner or cache of its own; the old job's timeout, now on the step)
      - name: Encrypted storage against RustFS
        timeout-minutes: 20
        run: bash tools/ci/test-rustfs.sh
      # (before the cache is saved: only the registry crates' builds are worth keeping;
      # target/sst and target/testfloat have caches of their own)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: rm -rf target/sst target/testfloat && python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # koji's JITs against its interpreter (random code, run by wasmtime) and the interpreter
  # against the runner's CPU: long mode (jit64test) and 32-bit (jit32test: regions and function
  # mode through its dispatcher; integer/MMX/SSE/x87). One job: the four runs are single-threaded,
  # so they run side by side as background steps on the runner's cores (one runner, not two).
  # koji's x86-64 JIT: 20000 random programs against the interpreter (a new seed per run, in four
  # parts at once: the runner's four cores; one part alone took over 30 minutes), and the
  # interpreter against the runner's CPU
  jit64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit64test/target
          key: jit64-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('tools/jit64test/Cargo.lock') }}
          restore-keys: |
            jit64-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Build jit64test
        working-directory: tools/jit64test
        run: cargo build --release --locked && cargo test --release --locked
      - name: Long mode, JIT against the interpreter, part 1 of 4
        id: jit64-diff0
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 0 ))
      - name: Long mode, JIT against the interpreter, part 2 of 4
        id: jit64-diff1
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 1 ))
      - name: Long mode, JIT against the interpreter, part 3 of 4
        id: jit64-diff2
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 2 ))
      - name: Long mode, JIT against the interpreter, part 4 of 4
        id: jit64-diff3
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test 5000 $(( ${{ github.run_number }} * 4 + 3 ))
      - name: Long mode, interpreter against the runner's CPU, one instruction at a time
        id: jit64-native
        background: true
        working-directory: tools/jit64test
        run: target/release/jit64test native 30000 ${{ github.run_number }}
      - name: Wait for the five runs
        wait: [jit64-diff0, jit64-diff1, jit64-diff2, jit64-diff3, jit64-native]
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py tools/jit64test/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit64test/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # koji's 32-bit JIT against the interpreter (four parts at once: each run is single-threaded
  # and the runner has four cores), the runner's CPU and TestFloat (x87/SSE results and MXCSR
  # flags, a sample per instruction and rounding mode). Its 16-bit JIT (Win16 code) is jit16:
  # the two jobs need different builds and caches, and run side by side on two runners.
  jit32:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit32test/target
          key: jit32-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('tools/jit32test/Cargo.lock') }}
          restore-keys: |
            jit32-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-apt
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib
      - name: gcc-multilib (jit32test native)
        id: apt
        background: true
        run: tools/ci/apt.sh gcc-multilib
      - id: cache-tf
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build TestFloat
        run: tests/testfloat/build.sh
      - if: steps.cache-tf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/testfloat
          key: testfloat-${{ runner.os }}-${{ hashFiles('tests/testfloat/build.sh') }}
      - name: Build jit32test
        working-directory: tools/jit32test
        run: cargo build --release --locked
      - name: 32-bit, JIT against the interpreter, part 1 of 4
        id: jit32-diff0
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test 2500 $(( ${{ github.run_number }} * 4 + 0 ))
      - name: 32-bit, JIT against the interpreter, part 2 of 4
        id: jit32-diff1
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test 2500 $(( ${{ github.run_number }} * 4 + 1 ))
      - name: 32-bit, JIT against the interpreter, part 3 of 4
        id: jit32-diff2
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test 2500 $(( ${{ github.run_number }} * 4 + 2 ))
      - name: 32-bit, JIT against the interpreter, part 4 of 4
        id: jit32-diff3
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test 2500 $(( ${{ github.run_number }} * 4 + 3 ))
      - name: 32-bit, JIT against TestFloat
        id: jit32-tf
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test testfloat
      - wait: apt
      - if: steps.cache-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-gcc-multilib
      - name: 32-bit, against the runner's CPU (random rounding modes and precisions)
        id: jit32-native
        background: true
        working-directory: tools/jit32test
        run: target/release/jit32test native 3000 ${{ github.run_number }}
      - name: Wait for the six runs
        wait: [jit32-diff0, jit32-diff1, jit32-diff2, jit32-diff3, jit32-tf, jit32-native]
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py tools/jit32test/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit32test/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # koji's 16-bit JIT (Win16 code) against its interpreter and real chips (SingleStepTests:
  # 80386, 80286, 8086, 8088, V20; what it translates, SST_N per opcode file). A suite per
  # background step: the five are independent, so the job ends with the slowest alone rather
  # than with their sum.
  jit16:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit16test/target
          key: jit16-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('tools/jit16test/Cargo.lock') }}
          restore-keys: |
            jit16-${{ runner.os }}-${{ env.RUST_KEY }}-
      # (SingleStepTests for jit16test, pinned by fetch.sh; shared with the test job's cache)
      - id: cache-sst
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: SingleStepTests
        id: sst
        background: true
        run: tests/sst/fetch.sh
      - name: Build jit16test
        working-directory: tools/jit16test
        run: cargo build --release --locked
      - name: 16-bit, JIT against the interpreter (new seed per run)
        id: jit16-diff
        background: true
        working-directory: tools/jit16test
        run: target/release/jit16test 1500 ${{ github.run_number }}
      - wait: sst
      - if: steps.cache-sst.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/sst
          key: sst-${{ hashFiles('tests/sst/fetch.sh') }}
      - name: 16-bit, against the chips (SingleStepTests 80386)
        id: jit16-sst-80386
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 target/release/jit16test sst 80386
      - name: 16-bit, against the chips (SingleStepTests 80286)
        id: jit16-sst-80286
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 target/release/jit16test sst 80286
      - name: 16-bit, against the chips (SingleStepTests 8086)
        id: jit16-sst-8086
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 target/release/jit16test sst 8086
      - name: 16-bit, against the chips (SingleStepTests 8088)
        id: jit16-sst-8088
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 target/release/jit16test sst 8088
      - name: 16-bit, against the chips (SingleStepTests V20)
        id: jit16-sst-v20
        background: true
        working-directory: tools/jit16test
        run: SST_N=80 target/release/jit16test sst V20
      - name: Wait for the six runs
        wait: [jit16-diff, jit16-sst-80386, jit16-sst-80286, jit16-sst-8086, jit16-sst-8088, jit16-sst-v20]
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py tools/jit16test/target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/jit16test/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # (git describe names the build)
      - run: tools/ci/cache-keys.sh
      # (.debs per runner image: tools/ci/apt.sh)
      - id: cache-5
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-zstd-clang-lld-llvm-msitools-wixl-nsis-ipafont
      - name: mingw-w64, zstd, clang, msitools (host/tests/msiinstall.wxs), the IPA fonts (host/tests/innoinstall.c)
        id: apt
        background: true
        run: tools/ci/apt.sh mingw-w64 zstd clang lld llvm msitools wixl nsis fonts-ipafont-gothic fonts-ipafont-mincho
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      # (pnpm, never npm: tools/ci/pnpm.sh; its store and corepack's pnpm are cached)
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-build-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-build-
      - run: tools/ci/pnpm.sh
      - run: tools/ci/rust-key.sh
      # (rust-src and the emscripten std, per stable rustc)
      - id: cache-6
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      - run: tools/ci/rust-wasm.sh
      - if: steps.cache-6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/components
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-src
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/manifest-rust-std-wasm32-unknown-emscripten
            ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/multirust-config.toml
          key: rust-wasm-${{ env.RUST_KEY }}
      # (Emscripten, one cache for every workflow that builds sake (conformance, release, winref,
      # bench): in the cargo caches it was a copy per workflow, and the caches' 10 GB is shared)
      - id: cache-emsdk
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/emsdk4
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/ci/emsdk.sh') }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh') }}
          restore-keys: |
            build-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock', 'tools/ci/build.sh') }}-
            build-${{ runner.os }}-${{ env.RUST_KEY }}-
      - name: Web check (Oxfmt, Oxlint, types; warnings are errors)
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run check && pnpm exec vp test
      - name: pnpm only (tools/ci/no-npm.sh)
        run: tools/ci/no-npm.sh
      - name: Fetch ordering tests
        run: node tests/fetch-bridge.test.mjs
      - name: Shared VFS, account bridge and node stdio tests (host/vnfs.js, host/account-bridge.js, host/node-stdio.js)
        run: node --test tests/vfs-shared.mjs tests/account-bridge.mjs tests/node-stdio.mjs
      - wait: apt
      - if: steps.cache-5.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-zstd-clang-lld-llvm-msitools-wixl-nsis-ipafont
      - name: Build
        run: tools/ci/build.sh
      # Publish once; the host suites, snapshots, browser and Windows checks below each get
      # their own runner. Four suites on this runner took 11 minutes, after the Windows build;
      # six at once took 17 minutes and raced. No test needs to rebuild sake to check it.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-sake-node
          path: |
            target/sake-out/*.js
            target/sake-out/*.wasm
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ippai
          path: target/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: web/dist
          retention-days: 14
      # (saved after the checks (compressing it while they run would take their cores), and on
      # main only: a copy per pull request or tag would be unusable by the others)
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cache-emsdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/emsdk4
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/ci/emsdk.sh') }}
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  host-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        build: [sake, sake-grow]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-sake-node
          path: target/sake-out
      - run: tools/ci/cache-keys.sh
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.apt-cache
          key: apt-${{ env.CI_IMAGE }}-mingw-w64-zstd-clang-lld-llvm-msitools-wixl-nsis-ipafont
      - run: tools/ci/apt.sh mingw-w64 zstd clang lld llvm msitools wixl nsis fonts-ipafont-gothic fonts-ipafont-mincho
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.pip-wheels
          key: pip-${{ runner.os }}-fonttools==4.59.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ippai-inno
          key: inno-6.7.4
      - name: Fonts for host/tests
        run: |
          tools/ci/pip.sh fonttools==4.59.0
          mkdir -p "$RUNNER_TEMP/fonts" && python3 tools/ci/sake-fonts.py "$RUNNER_TEMP/fonts"
      - name: host/tests on ${{ matrix.build }}
        env:
          SAKE_BUILD: ${{ matrix.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/api-counts"
          if [ "$SAKE_BUILD" = sake-grow ]; then export IPPAI_JIT_RECLAIM=1; fi
          IPPAI_API_COUNTS=1 IPPAI_API_COUNTS_OUT=$RUNNER_TEMP/api-counts/host-tests.txt SAKE_C=$RUNNER_TEMP/sake-c SAKE_FONTS=$RUNNER_TEMP/fonts SAKE=$PWD/target/sake-out/$SAKE_BUILD.js tests/host-tests.sh
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && matrix.build == 'sake' }}
        with:
          name: api-counts-host-tests
          path: ${{ runner.temp }}/api-counts/
          if-no-files-found: ignore
          retention-days: 30

  snapshots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [sake, sake-grow]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-sake-node
          path: target/sake-out
      - run: tools/ci/apt.sh mingw-w64 zstd
      - name: Save states under node (cut anywhere, restored, the same output)
        env:
          SAKE_BUILD: ${{ matrix.build }}
        run: |
          if [ "$SAKE_BUILD" = sake-grow ]; then export EXES=snaptest TIMES="0.7 2.1"; fi
          SAKE_C=$RUNNER_TEMP/sake-c SAKE=$PWD/target/sake-out/$SAKE_BUILD.js tests/snap.sh

  page-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-build-${{ hashFiles('web/pnpm-lock.yaml', 'web/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-build-
      - run: tools/ci/pnpm.sh
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ippai
          path: target/dist
      - name: Use the exact packaged build, not another compilation
        run: |
          mkdir -p target/release
          tar --zstd -xf target/dist/ippai-*.tar.zst -C target/release --strip-components=1
          ln -s ../target/release/web web/dist
      - run: tools/ci/apt.sh mingw-w64
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/ippai-browser" && pnpm add --dir "$RUNNER_TEMP/ippai-browser" playwright@1.63.0
          "$RUNNER_TEMP/ippai-browser/node_modules/.bin/playwright" install chromium
      # One browser at a time: software rendering itself uses several cores.
      - name: The page's tests
        env:
          PLAYWRIGHT: ${{ runner.temp }}/ippai-browser/node_modules/playwright/index.mjs
          SAKE_WEB: target/release/web/sake/
        run: |
          node tests/savestate-browser.mjs target/release/ippai
          node tests/autoadvance-browser.mjs target/release/ippai
          node tests/exec-browser.mjs target/release/ippai
          node tests/screen-browser.mjs target/release/ippai
          node tests/direct-browser.mjs
          node tests/save-first-browser.mjs target/release/ippai

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/rust-key.sh
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ runner.os }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
      - run: tools/ci/apt.sh mingw-w64
      - run: rustup target add x86_64-pc-windows-gnu
      - name: ippai for Windows builds without warnings
        run: RUSTFLAGS="-D warnings" cargo build --release -p ippai --target x86_64-pc-windows-gnu
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target
