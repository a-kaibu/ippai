# The Rust tests under AddressSanitizer (out of bounds, use after free, leaks: guest memory
# through raw pointers, MAP_32BIT arenas, the C runtime's heap) and ThreadSanitizer (races
# between guest threads, the JIT's compiler thread, movie and audio workers): tools/ci/sanitize.sh.
#
# How often: ASan on every push to main that touches Rust or C (memory safety is never left
# out): one run at a time, and of the commits pushed meanwhile only the newest waits (it holds the
# others' changes too), so a burst of commits doesn't queue a run per commit. A running run is not
# cancelled: ASan takes over an hour, longer than threads go between pushes, so cancelling would
# never let one finish. Both sanitizers every night, on pull requests, on release tags (v*) and by hand.
name: Sanitize

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.rs"
      - "**.c"
      - "**.h"
      - "**/Cargo.toml"
      - Cargo.lock
      - tools/ci/sanitize.sh
      - tools/ci/lsan.supp
      - .github/workflows/sanitize.yml
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (per branch, tag or pull request; the nightly and manual runs have their own group, so a
  # push doesn't replace them)
  group: sanitize-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        # (a push to main: ASan; the rest: both)
        kind: ${{ fromJSON(github.event_name == 'push' && github.ref_type == 'branch' && '["address"]' || '["address", "thread"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/cache-keys.sh
      # (the nightly toolchain, downloaded once a week: tools/ci/nightly.sh; llvm-tools for its
      # llvm-symbolizer, which lsan.supp needs)
      - id: cache-1
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
          key: rust-nightly-rust-src-llvm-tools-${{ env.CI_WEEK }}
      - run: tools/ci/nightly.sh rust-src llvm-tools
      - if: steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-x86_64-unknown-linux-gnu
          key: rust-nightly-rust-src-llvm-tools-${{ env.CI_WEEK }}
      - id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/sanitize-${{ matrix.kind }}
          key: sanitize-${{ matrix.kind }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sanitize-${{ matrix.kind }}-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}-
            sanitize-${{ matrix.kind }}-${{ env.RUST_KEY }}-
      - name: Tests under ${{ matrix.kind }} sanitizer
        run: tools/ci/sanitize.sh ${{ matrix.kind }}
      # (before the cache is saved: only the registry crates' builds are worth keeping)
      - name: Shrink the cargo cache
        if: ${{ !cancelled() }}
        run: python3 tools/ci/cache-prune.py target/sanitize-${{ matrix.kind }}
      # (saved when the tests fail too: the registry crates' builds are good either way)
      - if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/sanitize-${{ matrix.kind }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
