# Benchmarks on every commit to main (tests/bench): after CI builds a commit, each group runs on
# its own runner with this build and the previous commit's build (CI's "ippai" artifacts) side by
# side, alternating round by round, so a slow runner slows both alike. The report (job summary,
# artifact bench-report) says what got faster or slower; the history (artifact bench-history,
# carried from run to run) keeps the medians of the last 300 commits. No game files and no
# screenshots: only JSON and Markdown.
#   groups: cpu-kernels, cpu-game (the x86 JIT and the Win32 layer), gdi, ddraw, d3d8, d3d9,
#   d3d11, d2d, gl (each graphics API), js (the kernels as plain wasm in V8 and JavaScriptCore)
name: Bench

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      groups:
        description: "groups (space-separated; empty = all)"
        default: ""
      rounds:
        description: "measured rounds per build"
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  # (one at a time, so a run has the runners to itself and 10 jobs at most; a newer commit waits)
  group: bench
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      sha: ${{ steps.p.outputs.sha }}
      old_run_id: ${{ steps.p.outputs.old_run_id }}
      old_sha: ${{ steps.p.outputs.old_sha }}
      groups: ${{ steps.p.outputs.groups }}
      js: ${{ steps.p.outputs.js }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GROUPS: ${{ inputs.groups }}
        run: |
          # successful CI runs of main, newest first, whose build artifact is still there
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 30 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          has_build() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" --jq '[.artifacts[] | select(.name == "ippai" and (.expired | not))] | length' | grep -qx 1; }
          if [ "$EVENT" != workflow_run ]; then read -r RUN_ID SHA <<< "$(echo "$runs" | head -1)"; fi
          OLD_RUN_ID="" OLD_SHA=""
          while read -r id sha; do
            [ -n "$id" ] && [ "$sha" != "$SHA" ] && [ "$id" -lt "$RUN_ID" ] || continue
            if has_build "$id"; then OLD_RUN_ID=$id OLD_SHA=$sha; break; fi
          done <<< "$runs"
          ALL="cpu-kernels cpu-game gdi ddraw d3d8 d3d9 d3d11 d2d gl"
          G=${GROUPS:-$ALL js}
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "old_run_id=$OLD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          echo "groups=$(python3 -c 'import json, sys; print(json.dumps([g for g in sys.argv[1:] if g != "js"]))' $G)" >> "$GITHUB_OUTPUT"
          echo "js=$(echo " $G " | grep -q ' js ' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "this: CI run $RUN_ID ($SHA); previous: ${OLD_RUN_ID:-none} (${OLD_SHA:-none}); groups: $G"

  run:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # (with the js job: 10 at once at most)
      max-parallel: 9
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      # (the programs and the harness of the commit measured)
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ippai
          path: dist-new
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.2
        if: needs.plan.outputs.old_run_id != ''
        with:
          name: ippai
          path: dist-old
          run-id: ${{ needs.plan.outputs.old_run_id }}
          github-token: ${{ github.token }}
      - name: Tools
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          OLD_SHA: ${{ needs.plan.outputs.old_sha }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64 zstd fonts-ipafont-gothic fonts-ipafont-mincho
          pip install --user -q fonttools==4.59.0
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          python3 tools/ci/sake-fonts.py "$RUNNER_TEMP/fonts"
          unpack() {  # artifact dir, sha, destination (the build's tarball is named by git describe)
            local t
            t=$(ls "$1"/ippai-*"${2:0:7}"*.tar.zst 2>/dev/null | head -1)
            t=${t:-$(ls "$1"/ippai-*.tar.zst | head -1)}
            mkdir -p "$3" && tar -I zstd -xf "$t" -C "$3" --strip-components=1
          }
          unpack dist-new "$SHA" "$RUNNER_TEMP/new"
          if [ -d dist-old ]; then unpack dist-old "$OLD_SHA" "$RUNNER_TEMP/old"; fi
      - name: Bench ${{ matrix.group }}
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          export NEW=$RUNNER_TEMP/new
          if [ -d "$RUNNER_TEMP/old" ]; then export OLD=$RUNNER_TEMP/old; fi
          tests/bench/ci.sh "results/${{ matrix.group }}.json" "$RUNNER_TEMP/fonts" "${{ matrix.group }}"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.group }}
          path: results/*.json
          retention-days: 30
          if-no-files-found: ignore

  js:
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk4
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/ci/emsdk.sh') }}
      - name: Bench js (V8 and JavaScriptCore)
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
        run: tests/bench/js.sh results/js.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bench-js
          path: results/*.json
          retention-days: 30
          if-no-files-found: ignore

  report:
    needs: [plan, run, js]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bench-*
          path: results
      - name: Previous history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest bench-history artifact any earlier run left
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-history&per_page=1" --jq '.artifacts[0] | select(.expired | not) | .workflow_run.id' || true)
          if [ -n "$id" ]; then gh run download "$id" --repo "$GITHUB_REPOSITORY" --name bench-history --dir history || true; fi
          ls history 2>/dev/null || echo "no history yet"
      - name: Report
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          OLD_SHA: ${{ needs.plan.outputs.old_sha }}
        run: |
          python3 tests/bench/report.py results --sha "$SHA" --old-sha "$OLD_SHA" --history history/history.json \
            --history-out history.json --out report.md --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bench-history
          path: history.json
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bench-report
          path: report.md
          retention-days: 90
          if-no-files-found: ignore
