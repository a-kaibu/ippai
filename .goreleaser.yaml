# GoReleaser: the release archives of ippai (one binary with the web app built in) for GitHub
# Releases. .github/workflows/release.yml runs it after CI built web/dist (sake.wasm and the
# page: they are the same for every target, so they are built once, before this).
version: 2
project_name: ippai

builds:
  - id: ippai
    builder: rust
    binary: ippai
    # (a workspace: build the one package)
    dir: crates/ippai
    command: zigbuild
    flags: [--release, --locked]
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    env:
      - IPPAI_VERSION={{ .Version }}
      # (GoReleaser looks for the binary under dir/target: a workspace would build into ../../target)
      - CARGO_TARGET_DIR=target
    hooks:
      # a release only when the x86-64 binary starts, serves its built-in page and stops
      post: tools/ci/smoke.sh "{{ .Path }}" "{{ .Target }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github-native

release:
  draft: false
