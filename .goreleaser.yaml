# GoReleaser: the release archives of ippai (one binary with the web app built in) for GitHub
# Releases. .github/workflows/release.yml builds web/dist (sake.wasm and the page, the same for
# every target) once, then each target's binary on a runner of its own (cargo zigbuild, in
# parallel), and runs this last: it only archives, checksums, SBOMs and publishes them.
version: 2
project_name: ippai

builds:
  - id: ippai
    builder: rust
    binary: ippai
    # (a workspace: build the one package)
    dir: crates/ippai
    # (the binaries are already built: tools/ci/prebuilt-cargo.sh copies them where GoReleaser
    # looks; release.yml's bin jobs build them with `cargo zigbuild --release --locked`)
    tool: ../../tools/ci/prebuilt-cargo.sh
    command: zigbuild
    flags: [--release, --locked]
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      # (pack, add and storage on the PC that has the games; serve runs in the foreground only)
      - x86_64-pc-windows-gnu
    env:
      # (GoReleaser looks for the binary under dir/target)
      - CARGO_TARGET_DIR=target

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      # sake's C:\ fonts (release.yml makes them: tools/ci/sake-fonts.py); install.sh puts them
      # where serve makes the store's C:\ from them (pack::ensure_prefix)
      - src: fonts/*
        dst: fonts

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github-native

release:
  draft: false
