[package]
name = "vnvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "vnvm's server and store tool: serve the web app, pack trees, manage the game list"

[dependencies]
anyhow = "1"
vnx86 = { path = "../vnx86" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
blake3 = "1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json", "native-certs"] }
