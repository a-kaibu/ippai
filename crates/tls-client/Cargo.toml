[package]
name = "masu-tls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Verified TLS and bounded HTTP/1.1 over a caller-provided encrypted-stream transport"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
httparse = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
