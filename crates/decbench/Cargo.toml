[package]
name = "decbench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Decode-path benchmarks of sake.wasm's own decoders (images, movies, sound, textures), built to wasm with and without SIMD128 and run in V8: tests/decbench/run.sh"

[dependencies]
kura = { path = "../kura" }
mpeg1 = { path = "../mpeg1" }
vorbis = { path = "../vorbis" }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false, features = ["platform_independent"] }
