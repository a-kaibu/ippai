[package]
name = "sake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "From-scratch Win32 layer (HLE of kernel32/user32/gdi32/dsound...) for running 32-bit Windows games on vnx86 in the browser, without Wine"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vnx86 = { path = "../vnx86" }
vnhost = { path = "../vnhost" }
libc = "0.2"
dlmalloc = "0.2"
encoding_rs = "0.8"
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
md5 = "0.8"
ttf-parser = "0.25"
sha2 = "0.10"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
