[package]
name = "sake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "From-scratch Win32 layer (HLE of kernel32/user32/gdi32/dsound...) for running 32-bit Windows games on koji in the browser"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
koji = { path = "../koji" }
kura = { path = "../kura" }
hlslc = { path = "../hlslc" }
dxwgsl = { path = "../dxwgsl" }
vorbis = { path = "../vorbis" }
crt = { path = "../crt" }
libm = "0.2"
libc = "0.2"
dlmalloc = "0.2"
encoding_rs = "0.8"
ab_glyph = "0.2"
md5 = "0.8"
ttf-parser = "0.25"
sha2 = "0.10"
sha1 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "hazmat", "u64_digit"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "std"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "std"] }
hmac = "0.12"
md5_rc = { package = "md-5", version = "0.10" }
rand_core = { version = "0.6", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
proptest = "1"
