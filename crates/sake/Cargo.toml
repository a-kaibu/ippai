[package]
name = "sake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "From-scratch Win32 layer (HLE of kernel32/user32/gdi32/dsound...) for running 32-bit Windows games on koji in the browser"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
koji = { path = "../koji" }
kura = { path = "../kura" }
hlslc = { path = "../hlslc" }
dxwgsl = { path = "../dxwgsl" }
libc = "0.2"
dlmalloc = "0.2"
encoding_rs = "0.8"
ab_glyph = "0.2"
md5 = "0.8"
ttf-parser = "0.25"
sha2 = "0.10"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
