[package]
name = "kura"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser host for sake on wasm32: the x86 run loop, file system, display, audio and WebGPU rendering"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
koji = { path = "../koji" }
waits = { path = "../waits" }
dxwgsl = { path = "../dxwgsl" }
glwgsl = { path = "../glwgsl" }
libc = "0.2"
bcdec_rs = "0.2"
foresee = { path = "../foresee" }
miniz_oxide = "0.8"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
half = "2"
texture2ddecoder = "0.1"
bcn-decode = "0.1"
proptest = "1"
hlslc = { path = "../hlslc" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
