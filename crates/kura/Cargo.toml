[package]
name = "kura"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host runtime for Wine's unix side on wasm32: in-process kernel shims and the x86 run loop"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
koji = { path = "../koji" }
libc = "0.2"
naga = { version = "30", features = ["glsl-in", "wgsl-in", "wgsl-out"] }  # (naga 30's glsl-in needs spv-in or wgsl-in)
