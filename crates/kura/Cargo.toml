[package]
name = "kura"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser host for sake on wasm32: the x86 run loop, file system, display, audio and WebGPU rendering"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
koji = { path = "../koji" }
dxwgsl = { path = "../dxwgsl" }
glwgsl = { path = "../glwgsl" }
libc = "0.2"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
