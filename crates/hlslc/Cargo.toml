[package]
name = "hlslc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HLSL compiler: source to DXBC (shader model 4/5), Direct3D 9 bytecode (2/3) and fx_2_0 effects; Direct3D 9 shader assembler"

[dependencies]

[dev-dependencies]
dxwgsl = { path = "../dxwgsl" }
naga = { version = "30", features = ["wgsl-in"] }
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }
