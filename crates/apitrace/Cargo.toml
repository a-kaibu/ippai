[package]
name = "apitrace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads apitrace's .trace files (Windows D3D calls recorded on real Windows) and turns a D3D9 trace into the call stream tests/replay/d3d9replay.c plays back"

[dev-dependencies]
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }
