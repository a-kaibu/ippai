[package]
name = "ippai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ippai: play visual novels in the browser. The server (web app built in) and the game store in one binary"

[dependencies]
foresee = { path = "../foresee" }
libc = "0.2"
anyhow = "1"
# sdrs v1.0.0 (core only; no CLI or GUI).
sdrs-core = { git = "https://github.com/a-kaibu/sdrs", rev = "91be70fc0c7ee9a501b5cf06235abc655a84f4c8" }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
ring = "0.17"
koji = { path = "../koji" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "time", "io-util", "sync"] }
tower = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-zstd"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
blake3 = "1"
form_urlencoded = "1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
encoding_rs = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
unicode-normalization = "0.1"
rust-embed = { version = "8", features = ["include-exclude"] }
directories = "6"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "2", features = ["json", "native-certs"] }
# the official RPG Maker RTP installers (rtp.rs): Inno Setup (VX Ace, VX, XP) and the MS cab around 2000/2003
inno = { version = "=0.7.5", features = ["extract"] }
cab = "0.6"
md-5 = "0.11"

[dev-dependencies]
ippai-tls = { path = "../tls-client" }
proptest = "1"
# (already in the tree through rust-s3) the 503 proxy in front of RustFS, storage/rustfs_tests.rs
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
