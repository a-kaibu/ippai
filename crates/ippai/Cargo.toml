[package]
name = "ippai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ippai: play visual novels in the browser. The server (web app built in) and the game store in one binary"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
ring = "0.17"
koji = { path = "../koji" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "time"] }
tower = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-zstd"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
blake3 = "1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
rust-embed = { version = "8", features = ["include-exclude"] }
directories = "6"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "2", features = ["json", "native-certs"] }
