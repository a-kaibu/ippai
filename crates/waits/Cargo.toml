[package]
name = "waits"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The lock-word protocols of Win32's user-mode synchronization (critical sections, SRW locks, condition variables, one-time init, WaitOnAddress), checked with loom"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
