[package]
name = "mpeg1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MPEG-1 system streams (ISO/IEC 11172-1), video (11172-2) and audio layer II (11172-3) decoding, a port of pl_mpeg, for sake's DirectShow MPEG-1 splitter and decoders"

[dependencies]

[dev-dependencies]
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
