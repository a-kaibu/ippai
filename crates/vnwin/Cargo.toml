[package]
name = "vnwin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "From-scratch Win32 layer (HLE of kernel32/user32/gdi32/dsound...) for running 32-bit Windows games on vnx86 in the browser, without Wine"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vnx86 = { path = "../vnx86" }
vnhost = { path = "../vnhost" }
libc = "0.2"
dlmalloc = "0.2"
encoding_rs = "0.8"
ab_glyph = "0.2"
