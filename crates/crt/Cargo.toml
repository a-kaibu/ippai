[package]
name = "crt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The C runtime's pure parts as the MS CRT specifies them (printf/scanf formatting, strto*, the _s string functions, time conversion, strftime), independent of guest memory"

[dependencies]

[dev-dependencies]
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
