[workspace]
resolver = "2"
members = ["crates/apitrace", "crates/crt", "crates/dxwgsl", "crates/vorbis", "crates/hlslc", "crates/glwgsl", "crates/kura", "crates/ippai", "crates/koji", "crates/sake", "crates/msidb", "crates/tls-client", "crates/shaderconf", "crates/waits"]
exclude = ["fuzz", "vendor/ring"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# (naga validates every shader the tests translate: unoptimized, a big compute shader takes
# seconds)
[profile.dev.package.naga]
opt-level = 2

# cargo-mutants (.cargo/mutants.toml): quick to rebuild, fast enough for the exhaustive tests;
# no overflow checks, as the release build CI tests (a debug-only panic is not a caught mutant).
[profile.mutants]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
overflow-checks = false

[patch.crates-io]
ring = { path = "vendor/ring" }
