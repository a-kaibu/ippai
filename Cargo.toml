[workspace]
resolver = "2"
members = ["crates/dxwgsl", "crates/vorbis", "crates/hlslc", "crates/glwgsl", "crates/kura", "crates/ippai", "crates/koji", "crates/sake", "crates/shaderconf"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# cargo-mutants (.cargo/mutants.toml): quick to rebuild, fast enough for the exhaustive tests;
# no overflow checks, as the release build CI tests (a debug-only panic is not a caught mutant).
[profile.mutants]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
overflow-checks = false
